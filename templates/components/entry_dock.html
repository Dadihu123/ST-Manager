<!-- templates/components/entry_dock.html -->
<!--
  入口坞（设计文档 §4.4.4 / §5.1 的 `dock` 落点）。

  数据来源：`ContributionRegistry.dockItems()`（槽位）与 `dockOverflow()`（溢出）。
  容量上限（全局 8 / 每插件 2）由注册表统一裁剪，坞只负责渲染：
  槽位图标 + 「更多」溢出浮层（搜索 + 按插件分组）。

  位置：右侧 fixed 覆盖层，**垂直居中**，不占用内容区宽度。
  收起态只有一枚毛玻璃小箭头（`.entry-rail__toggle`），点击后向左弹出
  一只毛玻璃浮层小框（`.entry-rail__panel`），框高随入口数量自适应。
  根元素带 data-marquee-ignore，框选不会命中坞。
  键盘：role="toolbar" + aria-orientation="vertical" + roving tabindex。
  移动端不渲染侧条，退化为**贴在底部翻页栏上的向上箭头** + 底部 sheet。
  坞不再有 pinned / hidden / order / 拖拽：排序由注册表 `order → pluginId → id` 决定。
-->
<div
  id="entry-dock-root"
  x-data="entryDock"
  data-marquee-ignore
  class="entry-dock-root"
>
  <!-- 移动端：卡在底部翻页栏上的向上箭头。
       位置：`position: fixed` 贴视口右下角，落进翻页栏那条带子里；
       翻页栏通过 body 上的 `entry-dock-mobile-docked` 类让出右侧内边距（见 CSS）。
       点击向上弹出底部 sheet。
       `hasEntries` 为假时整个按钮不出现（没有 dock 贡献时点开只会是空 sheet）。 -->
  <template x-if="deviceType === 'mobile'">
    <button
      type="button"
      class="entry-dock-mobile-trigger"
      data-marquee-ignore
      x-show="hasEntries"
      aria-haspopup="dialog"
      :aria-expanded="expanded ? 'true' : 'false'"
      :title="expanded ? '收起插件入口' : '展开插件入口'"
      :aria-label="expanded ? '收起插件入口' : '展开插件入口'"
      @click="toggle()"
    >
      <svg class="ui-icon ui-icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="/static/icons/ui.svg#icon-chevron-right"></use>
      </svg>
      <span
        class="entry-dock-mobile-trigger__count"
        x-show="entryCount > 0"
        x-text="entryCount"
        aria-hidden="true"
      ></span>
    </button>
  </template>

  <!-- 桌面 / 平板：右侧坞
       坞完全由插件 dock 贡献填充（宿主内建命令不进坞），一个都没有时右侧
       不该常驻一枚点了没用的箭头，因此浮层与箭头都按 `hasEntries` 门控。

       用 `x-show` 而不是把 `hasEntries` 塞进外层 `x-if`：外层的 `x-if` 只在
       deviceType 变化时重建整棵子树，把 `hasEntries` 并进去会让「插件装卸」
       也触发整树销毁重建。`x-show` 只切 `display`，不动 x-for 的生命周期。 -->
  <template x-if="deviceType !== 'mobile'">
    <div
      class="entry-rail"
      :class="{ 'is-expanded': expanded, 'is-collapsed': !expanded }"
      data-marquee-ignore
      x-show="hasEntries"
    >
      <!-- 收起态热区：只覆盖箭头周围一小块（不再是整屏高度的透明死区） -->
      <div
        class="entry-rail__hotzone"
        data-marquee-ignore
        aria-hidden="true"
        @mouseenter="onHotzoneEnter()"
        @mouseleave="onHotzoneLeave()"
        @click="expand()"
      ></div>

      <!-- 浮层：展开时向左长出，高度由入口数量决定 -->
      <div
        class="entry-rail__panel"
        role="toolbar"
        aria-orientation="vertical"
        aria-label="插件入口坞"
        @mouseenter="onHotzoneEnter()"
        @mouseleave="onHotzoneLeave()"
        @keydown="handleKeydown($event)"
      >
        <!-- 坞槽位：**只保留图标**，名称走 title tooltip -->
        <template x-for="entry in slots" :key="entryKey(entry)">
          <button
            type="button"
            class="entry-rail__slot"
            :class="[statusClass(entry), { 'is-disabled': !entry.enabled, 'is-active': activeKey === entryKey(entry) }]"
            :data-entry-key="entryKey(entry)"
            :tabindex="tabIndexFor(entry)"
            :title="menuNodeHint(entry)"
            :aria-label="entry.label"
            :aria-disabled="entry.enabled ? 'false' : 'true'"
            @click="entry.enabled ? open(entry) : onDisabledClick(entry)"
          >
            <span class="entry-rail__icon" x-html="buildIcon(entry).outerHTML"></span>

            <!-- 徽标 / 进度 / 忙碌 -->
            <span
              class="entry-rail__badge"
              x-show="badgeText(entry)"
              x-text="badgeText(entry)"
            ></span>
            <span
              class="entry-rail__progress"
              x-show="progressText(entry)"
              x-text="progressText(entry)"
            ></span>
            <span class="entry-rail__busy" x-show="entry.busy" aria-hidden="true"></span>
          </button>
        </template>

        <!-- 空态：全部 dock 贡献都进了溢出菜单 -->
        <template x-if="!slots.length">
          <p class="entry-rail__empty" x-show="expanded">暂无固定入口</p>
        </template>

        <!-- 溢出菜单入口（「更多」） -->
        <template x-if="overflow.length">
          <button
            type="button"
            class="entry-rail__slot entry-rail__slot--more"
            :tabindex="slots.length ? -1 : 0"
            :aria-expanded="overflowOpen ? 'true' : 'false'"
            aria-haspopup="true"
            aria-label="更多入口"
            title="更多入口"
            @click="toggleOverflow($event)"
          >
            <span class="entry-rail__icon" aria-hidden="true">⋯</span>
          </button>
        </template>
      </div>

      <!--
        开合箭头：放在 `__panel` **之外**，与浮层并列。
        这样浮层无论展开还是收起，箭头都钉在右边缘垂直居中的同一位置，
        点击目标不会在展开瞬间移动；浮层则向左长出。
      -->
      <button
        type="button"
        class="entry-rail__toggle"
        :aria-expanded="expanded ? 'true' : 'false'"
        :title="expanded ? '收起入口坞' : '展开入口坞'"
        :aria-label="expanded ? '收起入口坞' : '展开入口坞'"
        @mouseenter="onHotzoneEnter()"
        @mouseleave="onHotzoneLeave()"
        @click="toggle()"
      >
        <svg class="ui-icon ui-icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="/static/icons/ui.svg#icon-chevron-right"></use>
        </svg>
        <span
          class="entry-rail__toggle-count"
          x-show="entryCount > 0"
          x-text="entryCount"
          aria-hidden="true"
        ></span>
      </button>

      <!-- 溢出菜单弹层（「更多」）：搜索 + 按插件分组 -->
      <template x-if="overflowOpen">
        <div
          class="entry-overflow"
          data-marquee-ignore
          role="dialog"
          aria-label="更多入口"
          @click.outside="closeOverflow($event)"
          @keydown.escape.stop="closeOverflow()"
        >
          <div class="entry-overflow__header">
            <input
              type="search"
              class="entry-overflow__search"
              x-ref="overflowSearch"
              x-model="overflowQuery"
              placeholder="搜索入口…"
              aria-label="搜索入口"
            />
          </div>

          <div class="entry-overflow__body">
            <template x-for="group in overflowGroups" :key="group.pluginId">
              <section class="entry-overflow__group">
                <h4 class="entry-overflow__group-title" x-text="group.pluginId || '宿主'"></h4>
                <template x-for="entry in group.items" :key="entryKey(entry)">
                  <div class="entry-overflow__item">
                    <button
                      type="button"
                      class="entry-overflow__action"
                      :class="{ 'is-disabled': !entry.enabled }"
                      :title="menuNodeHint(entry)"
                      @click="entry.enabled ? open(entry) : onDisabledClick(entry)"
                    >
                      <span class="entry-overflow__icon" x-html="buildIcon(entry).outerHTML"></span>
                      <span class="entry-overflow__text">
                        <span class="entry-overflow__label" x-text="entry.label"></span>
                        <span
                          class="entry-overflow__description color-text-muted"
                          x-show="entry.description"
                          x-text="entry.description"
                        ></span>
                      </span>
                    </button>
                  </div>
                </template>
              </section>
            </template>

            <template x-if="!filteredOverflow.length">
              <p class="entry-overflow__empty color-text-muted">没有匹配的入口</p>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- 移动端底部 sheet
       `hasEntries` 一并门控：`expanded` 是持久化偏好，若用户上次开着 sheet
       关掉页面、之后又卸载了全部插件，重新打开会弹出一个空 sheet。 -->
  <template x-if="deviceType === 'mobile' && expanded && hasEntries">
    <div class="entry-sheet" data-marquee-ignore role="dialog" aria-modal="true" aria-label="插件入口">
      <div class="entry-sheet__backdrop" @click="collapse()"></div>
      <div class="entry-sheet__panel">
        <header class="entry-sheet__header">
          <span class="entry-sheet__title">插件入口</span>
          <button type="button" class="entry-sheet__close" aria-label="关闭" @click="collapse()">×</button>
        </header>
        <div class="entry-sheet__body">
          <template x-for="entry in entries" :key="entryKey(entry)">
            <button
              type="button"
              class="entry-sheet__item"
              :class="{ 'is-disabled': !entry.enabled }"
              :title="menuNodeHint(entry)"
              @click="entry.enabled ? (open(entry), collapse()) : onDisabledClick(entry)"
            >
              <span class="entry-sheet__icon" x-html="buildIcon(entry).outerHTML"></span>
              <span x-text="entry.label"></span>
            </button>
          </template>
          <template x-if="!entries.length">
            <p class="color-text-muted">暂无插件入口</p>
          </template>
        </div>
      </div>
    </div>
  </template>
</div>
