<!-- templates/components/command_palette.html -->
<!--
  命令面板（阶段 5）。

  搜索范围 = 全部注册表条目 + 宿主内建命令。
  快捷键 Ctrl/Cmd+K；挂载在 body 层级，由 Alpine 组件 commandPalette 驱动。
-->
<div
  id="command-palette-root"
  x-data="commandPalette"
  data-marquee-ignore
>
  <template x-if="open">
    <div
      class="command-palette"
      data-marquee-ignore
      role="dialog"
      aria-modal="true"
      aria-label="命令面板"
    >
      <div class="command-palette__backdrop" @click="close()"></div>

      <div class="command-palette__panel" @keydown="handleKeydown($event)">
        <div class="command-palette__search">
          <svg class="ui-icon ui-icon--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="/static/icons/ui.svg#icon-filter"></use>
          </svg>
          <input
            type="search"
            class="command-palette__input"
            x-ref="paletteInput"
            x-model="query"
            @input="onQueryInput()"
            placeholder="搜索入口或命令…"
            aria-label="搜索入口或命令"
            autocomplete="off"
          />
          <kbd class="command-palette__hint">Esc</kbd>
        </div>

        <div class="command-palette__results" role="listbox">
          <template x-for="(entry, index) in items" :key="entry.key">
            <button
              type="button"
              role="option"
              class="command-palette__item"
              :class="{
                'is-active': index === activeIndex,
                'is-disabled': isDisabled(entry),
              }"
              :aria-selected="index === activeIndex ? 'true' : 'false'"
              @click="activate(entry)"
              @mouseenter="activeIndex = index"
            >
              <span class="command-palette__icon" x-html="buildIcon(entry).outerHTML"></span>
              <span class="command-palette__text">
                <span class="command-palette__label" x-text="entry.label"></span>
                <span
                  class="command-palette__description color-text-muted"
                  x-show="entry.description"
                  x-text="entry.description"
                ></span>
              </span>
              <span class="command-palette__meta">
                <span class="command-palette__kind" x-text="kindLabel(entry)"></span>
                <span
                  class="command-palette__tier"
                  x-show="tierLabel(entry)"
                  x-text="tierLabel(entry)"
                ></span>
                <span class="command-palette__origin color-text-muted" x-text="originLabel(entry)"></span>
              </span>
            </button>
          </template>

          <template x-if="!items.length">
            <p class="command-palette__empty color-text-muted">没有匹配的入口</p>
          </template>
        </div>
      </div>
    </div>
  </template>
</div>
