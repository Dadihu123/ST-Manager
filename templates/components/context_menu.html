{% from "components/icon.html" import icon %}

<!-- 右键菜单 -->

<!-- 外层容器：根据设备类型切换布局 -->
<div x-data="contextMenu" x-show="visible" class="ui-refresh-surface" @click.away="hideContextMenu"
    :class="isMobile ? 'fixed inset-0 z-context-menu flex items-center justify-center' : 'fixed z-context-menu'"
    :style="isMobile ? {} : { top: y + 'px', left: x + 'px', display: visible ? 'block' : 'none' }"
    style="display:none;">

    <!-- 移动端：半透明遮罩 -->
    <div x-show="isMobile" @click="hideContextMenu()" class="absolute inset-0 color-surface-scrim backdrop-blur-sm"></div>

    <!-- 菜单内容容器：根据设备类型调整样式 -->
    <div class="ui-context-menu" @click="closeSubmenu()"
        :class="isMobile ? 'w-64 max-w-[90vw] rounded-xl shadow-2xl overflow-hidden relative z-10' : 'shadow-xl rounded-lg py-1 w-56'"
        :style="{ maxHeight: menuMaxHeight ? menuMaxHeight + 'px' : 'none', overflowY: 'auto' }"
        style="background: var(--surface-container); border: 1px solid var(--border-default);">

        <!-- 移动端：标题栏 -->
        <div x-show="isMobile"
            class="px-4 py-3 border-b border-[var(--border-default)] flex items-center justify-between bg-[var(--surface-container-raised)]">
            <div class="text-sm font-bold text-[var(--content-primary)]">目录操作</div>
            <button @click="hideContextMenu()"
                class="w-6 h-6 flex items-center justify-center text-[var(--content-muted)] hover:text-[var(--content-primary)]"
                aria-label="关闭目录操作菜单">
                {{ icon('close', 'ui-icon--sm context-menu-icon') }}
            </button>
        </div>

        <!-- 菜单项列表：共用同一份内容 -->
        <div :class="isMobile ? 'py-1' : 'py-1'">
            <template x-if="type === 'folder'">
                <div>
                    <button x-show="targetMode === 'cards' && target !== ''" @click="handleToggleIsolation()"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"
                        style="color: var(--content-primary);">
                        <!-- 根据状态显示不同文字 -->
                        <span class="inline-flex" aria-hidden="true">
                            <span x-show="($store.global.isolatedCategories || []).includes(target)">
                                {{ icon('unisolate', 'ui-icon--sm context-menu-icon') }}
                            </span>
                            <span x-show="!($store.global.isolatedCategories || []).includes(target)">
                                {{ icon('isolate', 'ui-icon--sm context-menu-icon') }}
                            </span>
                        </span>
                        <span
                            x-text="($store.global.isolatedCategories || []).includes(target) ? '取消隔离分类' : '设为隔离分类'"></span>
                    </button>
                    <button x-show="targetMode === 'cards' ? target !== '' : (target !== '' && targetFolderCapabilities.can_rename_physical_folder)" @click="handleRename()"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"
                        style="color: var(--content-primary);"><span aria-hidden="true">{{ icon('pencil-edit', 'ui-icon--sm context-menu-icon') }}</span> 重命名</button>
                    <button @click="handleCreateSub()"
                        x-show="targetMode === 'cards' || targetFolderCapabilities.can_create_child_folder"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"
                        style="color: var(--content-primary);"><span aria-hidden="true">{{ icon('plus-square', 'ui-icon--sm context-menu-icon') }}</span> 创建子分类</button>
                    <hr x-show="target !== ''"
                        :class="isMobile ? 'border-[var(--border-default)] my-1' : 'border-[var(--border-default)] my-1'">
                    <button x-show="targetMode === 'cards' && target !== ''" @click="handleBundle()"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base color-text-warning hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm color-text-warning hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"><span aria-hidden="true">{{ icon('package', 'ui-icon--sm context-menu-icon') }}</span>
                        切换"角色包"</button>
                    <button x-show="targetMode === 'cards' ? target !== '' : (target !== '' && targetFolderCapabilities.can_delete_physical_folder)" @click="handleDelete()"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base color-text-danger hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm color-text-danger hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"><span aria-hidden="true">{{ icon('trash', 'ui-icon--sm context-menu-icon') }}</span>
                        删除分类</button>
                    <hr :class="isMobile ? 'border-[var(--border-default)] my-1' : 'border-[var(--border-default)] my-1'">
                    <!-- 检查来源更新 -->
                    <button x-show="targetMode === 'cards'" @click="handleCheckSourceUpdates()"
                        :class="isMobile ? 'w-full text-left px-4 py-3 text-base hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2' : 'w-full text-left px-4 py-2 text-sm hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2'"
                        style="color: var(--content-primary);">
                        <span aria-hidden="true">{{ icon('card-update-check', 'ui-icon--sm context-menu-icon') }}</span> 检查分类更新
                    </button>
                    <!-- 运行自动化 -->
                    <!-- 桌面端：向右弹出规则集浮层（fixed，不在一级菜单盒里，
                         否则会被 overflow 裁掉）；再点一次收起 -->
                    <div x-show="targetMode === 'cards' && !isMobile">
                        <button type="button"
                            @click.stop="toggleRuleSetSubmenu($event.currentTarget)"
                            aria-haspopup="menu"
                            :aria-expanded="(activeSubmenu === 'ruleset').toString()"
                            class="w-full text-left px-4 py-2 text-sm hover:bg-[var(--state-hover-surface)] transition-colors flex items-center justify-between"
                            style="color: var(--content-primary);">
                            <span class="flex items-center gap-2"><span aria-hidden="true">{{ icon('workflow', 'ui-icon--sm context-menu-icon') }}</span> 运行自动化</span>
                            <span class="inline-flex" aria-hidden="true">{{ icon('chevron-right', 'ui-icon--xs') }}</span>
                        </button>
                    </div>

                    <!-- 移动端：直接打开执行规则弹窗 -->
                    <button x-show="targetMode === 'cards' && isMobile" @click="handleOpenExecuteRulesMobile()"
                        class="w-full text-left px-4 py-3 text-base hover:bg-[var(--state-hover-surface)] transition-colors flex items-center gap-2"
                        style="color: var(--content-primary);">
                        <span aria-hidden="true">{{ icon('workflow', 'ui-icon--sm context-menu-icon') }}</span> 运行自动化
                    </button>
                </div>
            </template>

            <!-- 插件贡献菜单（v3 三落点，设计 §5.1）。
                 一级菜单直接铺开：`context.folder` 只在右键目录时出现、
                 `context.card` 只在右键卡片时出现（由 refreshPluginEntries 过滤），
                 `context.footer` 固定收在菜单最尾部（最后一条分隔线之后）。
                 `when` 不通过的节点仍渲染，但置灰 + title 显示 disabledHint（不隐藏）。 -->
            <template x-if="pluginContextNodes.length">
                <div>
                    <hr class="border-[var(--border-default)] my-1">

                    <!-- 一级：普通节点 / 子菜单父项（移动端进入第二屏后隐藏） -->
                    <div x-show="!isMobile || !activeContributionNode()">
                        <template x-for="node in pluginContextNodes" :key="node.id">
                            <div>
                                <hr x-show="node.type === 'separator'"
                                    class="border-[var(--border-default)] my-1">
                                <button x-show="node.type !== 'separator' && hasMenuChildren(node)" type="button"
                                    @click.stop="toggleContributionSubmenu(node, $event.currentTarget)"
                                    aria-haspopup="menu"
                                    :aria-expanded="isContributionsubmenuOpen(node).toString()"
                                    :title="menuNodeHint(node)"
                                    :disabled="isMenuNodeDisabled(node)"
                                    :class="[(isMobile ? 'w-full text-left px-4 py-3 text-base' : 'w-full text-left px-4 py-2 text-sm') + ' transition-colors flex items-center gap-2', isMenuNodeDisabled(node) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[var(--state-hover-surface)]']"
                                    style="color: var(--content-primary);">
                                    <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(node)"></span>
                                    <span class="flex-1 min-w-0 truncate" x-text="node.label"></span>
                                    <span class="plugin-entries-badge" x-show="menuNodeBadge(node)"
                                        x-text="menuNodeBadge(node)"></span>
                                    <span class="inline-flex" aria-hidden="true">{{ icon('chevron-right', 'ui-icon--xs') }}</span>
                                </button>
                                <button x-show="node.type !== 'separator' && !hasMenuChildren(node)" type="button"
                                    @click="runPluginNode(node)"
                                    :title="menuNodeHint(node)"
                                    :disabled="isMenuNodeDisabled(node)"
                                    :class="[(isMobile ? 'w-full text-left px-4 py-3 text-base' : 'w-full text-left px-4 py-2 text-sm') + ' transition-colors flex items-center gap-2', isMenuNodeDisabled(node) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[var(--state-hover-surface)]']"
                                    style="color: var(--content-primary);">
                                    <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(node)"></span>
                                    <span class="flex-1 min-w-0 truncate" x-text="node.label"></span>
                                    <span class="plugin-entries-badge" x-show="menuNodeBadge(node)"
                                        x-text="menuNodeBadge(node)"></span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- 移动端第二屏：同一弹层里展开子菜单（桌面端走下面的 fixed 浮层） -->
                    <div x-show="isMobile && activeContributionNode()">
                        <button type="button" @click.stop="backFromContributionSubmenu()"
                            class="w-full text-left px-4 py-2 text-xs transition-colors flex items-center gap-1 hover:bg-[var(--state-hover-surface)]"
                            style="color: var(--content-muted);">
                            <span class="inline-flex rotate-180" aria-hidden="true">{{ icon('chevron-right', 'ui-icon--xs') }}</span>
                            <span x-text="activeContributionNode() && activeContributionNode().label"></span>
                        </button>
                        <template x-for="child in (activeContributionNode() ? activeContributionNode().children : [])" :key="child.id">
                            <button type="button" @click="runPluginNode(child)"
                                :title="menuNodeHint(child)"
                                :disabled="isMenuNodeDisabled(child)"
                                :class="['w-full text-left px-4 py-3 text-base transition-colors flex items-center gap-2', isMenuNodeDisabled(child) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[var(--state-hover-surface)]']"
                                style="color: var(--content-primary);">
                                <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(child)"></span>
                                <span class="flex-1 min-w-0 truncate" x-text="child.label"></span>
                                <span class="plugin-entries-badge" x-show="menuNodeBadge(child)"
                                    x-text="menuNodeBadge(child)"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </template>

            <!-- `context.footer`：右键菜单底部（folder / card 共用），固定收尾 -->
            <template x-if="pluginFooterNodes.length">
                <div>
                    <hr class="border-[var(--border-default)] my-1">
                    <template x-for="node in pluginFooterNodes" :key="node.id">
                        <div>
                            <hr x-show="node.type === 'separator'"
                                class="border-[var(--border-default)] my-1">
                            <button x-show="node.type !== 'separator'" type="button"
                                @click="runPluginNode(node)"
                                :title="menuNodeHint(node)"
                                :disabled="isMenuNodeDisabled(node)"
                                :class="[(isMobile ? 'w-full text-left px-4 py-3 text-base' : 'w-full text-left px-4 py-2 text-sm') + ' transition-colors flex items-center gap-2', isMenuNodeDisabled(node) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-[var(--state-hover-surface)]']"
                                style="color: var(--content-primary);">
                                <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(node)"></span>
                                <span class="flex-1 min-w-0 truncate" x-text="node.label"></span>
                                <span class="plugin-entries-badge" x-show="menuNodeBadge(node)"
                                    x-text="menuNodeBadge(node)"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <!-- 桌面端「运行自动化」的规则集二级菜单：独立 fixed 浮层。
         固定在父项右边展开；纵向放不下时向上延申（utils/flyoutPosition.js）。
         放在 `.ui-context-menu` 之外是必须的——菜单盒的 overflow 会把它裁掉。 -->
    <div data-context-ruleset-flyout x-show="!isMobile && activeSubmenu === 'ruleset'"
        x-cloak role="menu" class="plugin-menu-flyout plugin-menu-flyout--ruleset"
        style="position: fixed; top: -9999px; left: -9999px;" @click.stop>
        <div class="plugin-menu-flyout-title">选择规则集</div>
        <template x-for="rs in $store.global.availableRuleSets" :key="rs.id">
            <button type="button" @click.stop="handleRunAuto(rs.id)" class="plugin-menu-flyout-item">
                <span class="flex-1 min-w-0 truncate" x-text="rs.meta.name"></span>
            </button>
        </template>
        <div x-show="!$store.global.availableRuleSets || $store.global.availableRuleSets.length===0"
            class="plugin-menu-flyout-empty">(无规则集)</div>
    </div>

    <!-- 桌面端贡献子菜单：独立 fixed 浮层。
         挂在 `.ui-context-menu` 之外（菜单盒的 overflow 会裁掉子元素），
         位置由 `openSubmenu()` 在渲染后测量并写入 top/left；
         初始放在视口外，避免首帧闪在错误位置。
         第三层（深度 3）退化为浮层内 `<details>`，避免再开一层浮层。 -->
    <div data-plugin-contribution-flyout x-show="!isMobile && activeContributionNode()"
        x-cloak role="menu" class="plugin-menu-flyout" style="position: fixed; top: -9999px; left: -9999px;"
        @click.stop>
        <template x-if="activeContributionNode()">
            <div>
                <div class="plugin-menu-flyout-title" x-text="activeContributionNode().label"></div>
                <template x-for="child in activeContributionNode().children" :key="child.id">
                    <div>
                        <hr x-show="child.type === 'separator'" class="border-[var(--border-default)] my-1">
                        <button x-show="child.type !== 'separator' && !hasMenuChildren(child)" type="button"
                            @click.stop="runPluginNode(child)"
                            :title="menuNodeHint(child)" :disabled="isMenuNodeDisabled(child)"
                            :class="['plugin-menu-flyout-item', isMenuNodeDisabled(child) ? 'opacity-50 cursor-not-allowed' : '']">
                            <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(child)"></span>
                            <span class="flex-1 min-w-0 truncate" x-text="child.label"></span>
                            <span class="plugin-entries-badge" x-show="menuNodeBadge(child)"
                                x-text="menuNodeBadge(child)"></span>
                        </button>
                        <!-- 深度 3：浮层内折叠，不再新开一层浮层（设计 §4.4.4 深度 ≤ 3） -->
                        <details x-show="child.type !== 'separator' && hasMenuChildren(child)"
                            class="plugin-menu-flyout-details">
                            <summary class="plugin-menu-flyout-item">
                                <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(child)"></span>
                                <span class="flex-1 min-w-0 truncate" x-text="child.label"></span>
                                <span class="plugin-entries-badge" x-show="menuNodeBadge(child)"
                                    x-text="menuNodeBadge(child)"></span>
                            </summary>
                            <template x-for="grandchild in child.children" :key="grandchild.id">
                                <button type="button" @click.stop="runPluginNode(grandchild)"
                                    :title="menuNodeHint(grandchild)"
                                    :disabled="isMenuNodeDisabled(grandchild)"
                                    :class="['plugin-menu-flyout-item', isMenuNodeDisabled(grandchild) ? 'opacity-50 cursor-not-allowed' : '']">
                                    <span class="inline-flex" aria-hidden="true" x-html="menuNodeIconHtml(grandchild)"></span>
                                    <span class="flex-1 min-w-0 truncate" x-text="grandchild.label"></span>
                                </button>
                            </template>
                        </details>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- 删除文件夹确认弹窗 -->
    <div x-show="deleteFolderConfirm.visible" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-popover"
        @click.self="cancelDeleteFolder()">
        <div class="ui-small-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-folder-title">
            <div class="ui-small-dialog-header"><h3 id="delete-folder-title">删除文件夹</h3></div>

            <div class="ui-small-dialog-body">
              <div style="color: var(--content-muted); font-size: 0.875rem; margin-bottom: 0.75rem;">
                正在删除：<span class="font-mono" x-text="deleteFolderConfirm.path"></span>
                <div style="margin-top: 0.25rem;">
                    该文件夹包含 <span x-text="deleteFolderConfirm.cardCount"></span><span x-text="deleteFolderItemLabel"></span>
                    <span x-show="deleteFolderConfirm.hasSubfolders">并包含子文件夹</span>。
                </div>
              </div>

              <div style="color: var(--content-muted); font-size: 0.875rem; margin-bottom: 1rem;">
                <span x-text="deleteFolderModeSummary"></span>
              </div>

              <label x-show="supportsRecursiveFolderDelete" class="flex items-start gap-2 cursor-pointer select-none" style="margin-bottom: 1rem;">
                <input type="checkbox" x-model="deleteFolderConfirm.deleteChildren" class="cursor-pointer mt-1">
                <span style="color: var(--content-primary); font-size: 0.875rem;">删除子文件/子文件夹（递归删除）</span>
              </label>

              <div class="ui-small-dialog-actions">
                <button type="button" @click="cancelDeleteFolder()" class="btn-secondary">取消</button>
                <button type="button" @click="confirmDeleteFolder()" class="btn-primary">确定</button>
              </div>
            </div>
        </div>
    </div>
</div>
