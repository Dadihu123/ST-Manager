{% from "components/icon.html" import icon %}

<!-- 移动端：执行规则弹窗 -->
<div x-data="executeRulesMobileModal" x-show="showExecuteRulesModal" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-popover"
    @click.self="showExecuteRulesModal = false">
    <div class="ui-modal-shell execute-rules-modal-shell" role="dialog" aria-modal="true" aria-labelledby="execute-rules-modal-title">
        <!-- Header -->
        <div class="ui-modal-header ui-modal-header--compact">
            <h3 id="execute-rules-modal-title" class="ui-modal-title flex items-center gap-2">
                <span aria-hidden="true">{{ icon('workflow', 'ui-icon--sm') }}</span>
                <span>自动处理</span>
            </h3>
        </div>
        
        <div class="ui-modal-body execute-rules-modal-body">
            <div class="execute-rules-modal-form">
                <div>
                    <label style="font-weight: 500; margin-bottom: 0.5rem; display: block; font-size: 0.875rem; color: var(--content-primary);">选择规则集</label>
                    <!-- 卡片模式提示 -->
                    <div x-show="executeMode === 'cards'" style="font-size: 0.75rem; color: var(--content-muted); margin-bottom: 0.5rem;">
                        将对 <span x-text="cardIds.length" style="font-weight: bold;"></span> 张卡片执行规则
                    </div>
                    <!-- 文件夹模式提示 -->
                    <div x-show="executeMode === 'folder'" style="font-size: 0.75rem; color: var(--content-muted); margin-bottom: 0.5rem;">
                        将对文件夹 <span style="font-weight: bold;" x-text="folderCategory === '' ? '根目录' : folderCategory"></span> 
                        <span x-show="folderRecursive">(包括子文件夹)</span>
                        <span x-show="!folderRecursive">(仅当前文件夹)</span>
                        下的所有卡片执行规则
                    </div>
                    <!-- 规则集列表 -->
                    <div style="max-height: 300px; overflow-y: auto; border: 1px solid var(--border-default); border-radius: 0.5rem; background: var(--surface-container-raised);">
                        <template x-for="rs in $store.global.availableRuleSets" :key="rs.id">
                            <button @click="executeRuleSet(rs.id)"
                                class="w-full text-left px-3 py-2 text-sm hover:bg-[var(--state-hover-surface)] text-[var(--content-primary)] border-b border-[var(--border-default)] last:border-b-0 transition-colors"
                                style="display: flex; justify-content: space-between; align-items: center;">
                                <span x-text="rs.meta.name || '未命名规则集'"></span>
                                <span style="font-size: 0.75rem; color: var(--content-muted);" x-text="rs.rule_count + ' rules'"></span>
                            </button>
                        </template>
                        <div x-show="!$store.global.availableRuleSets || $store.global.availableRuleSets.length === 0" class="px-3 py-4 text-center text-xs text-[var(--content-muted)]">
                            无规则集
                        </div>
                    </div>
                </div>

                <div class="execute-rules-modal-actions">
                    <button type="button" @click="showExecuteRulesModal = false" class="btn-secondary">
                        取消
                    </button>
                    <button type="button" @click="$dispatch('open-automation-modal'); showExecuteRulesModal = false"
                        class="btn-soft-purple">
                        <span aria-hidden="true">{{ icon('settings', 'ui-icon--sm') }}</span>
                        <span>管理规则</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
