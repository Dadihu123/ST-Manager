{% from "components/icon.html" import icon %}

<!-- 只读 Markdown 预览模态框 -->
<div x-show="showMarkdownModal" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-popover" @click="showMarkdownModal=false">
    <div class="modal-container ui-modal-shell markdown-preview-shell"
        role="dialog" aria-modal="true" aria-labelledby="markdown-preview-title" @click.stop>

        <!-- 头部 -->
        <div class="ui-modal-header ui-modal-header--compact">
            <h3 id="markdown-preview-title" class="ui-modal-title flex items-center gap-2">
                <span aria-hidden="true">{{ icon('file', 'ui-icon--md') }}</span>
                <span>本地备注预览</span>
            </h3>
            <button type="button" @click="showMarkdownModal=false" class="ui-close-button" title="关闭 Markdown 预览" aria-label="关闭 Markdown 预览">
                {{ icon('close', 'ui-icon--md') }}
            </button>
        </div>

        <!-- 内容 (Markdown 渲染区) - Shadow DOM 安全版 -->
        <div class="flex-1 overflow-hidden relative"
            x-effect="updateShadowContent($el, showMarkdownModal ? renderMarkdown(markdownModalContent) : null, { scroll: true })">
        </div>

        <!-- 底部 -->
        <div class="ui-modal-footer markdown-preview-footer">
            只读模式，如需编辑请进入详情页
        </div>
    </div>
</div>
