{% from "components/icon.html" import detail_icon, icon %}

<!-- HTML 大屏预览模态框 -->
<div
  x-show="showLargePreview"
  x-cloak
  class="modal-overlay z-modal-popover"
  x-init="ensurePreviewState()"
  @click.self="showLargePreview=false"
>
  <div
    class="modal-container"
    style="
      width: 1000px;
      height: 90vh;
      flex-direction: column;
      background: var(--surface-container);
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-elevation);
    "
  >
    <!-- 头部 -->
    <div
      class="p-4 border-b flex justify-between items-center"
      style="background: var(--surface-container-raised); border-color: var(--border-default)"
    >
      <h3
        class="font-bold text-lg flex items-center gap-2"
        style="color: var(--content-primary)"
      >
        <span aria-hidden="true">{{ detail_icon('book-read', 'ui-icon--md') }}</span>
        <span>渲染结果预览 (HTML Preview)</span>
      </h3>
      <button
        @click="showLargePreview=false"
        aria-label="关闭 HTML 预览"
        class="color-text-muted color-hover-text-primary text-xl px-2"
      >
        {{ icon('close', 'ui-icon--md') }}
      </button>
    </div>

    <!-- 内容区 (Shadow DOM) -->
    <!-- 这里复用 updateShadowContent 函数，确保样式和逻辑与小框一致 -->
    <div
      class="flex-1 overflow-auto custom-scrollbar relative bg-[var(--surface-page)]"
      x-effect="renderUnifiedPreviewHost($el, showLargePreview ? regexTestResult : null, { runtimeOwner: 'fullscreen-html-preview', runtimeLabel: 'Fullscreen HTML Preview', scroll: false, minHeight: 260, maxHeight: 100000, embeddedStageStyle: false })"
    ></div>

    <!-- 底部 -->
    <div
      class="p-3 border-t text-right bg-[var(--surface-container-raised)] border-[var(--border-default)]"
    >
      <span class="text-xs text-[var(--content-muted)] mr-4"
        >提示：此视图样式已隔离，不受外部 CSS 影响</span
      >
      <button @click="showLargePreview=false" class="btn-secondary px-4 py-1">
        关闭 (Esc)
      </button>
    </div>
  </div>
</div>
