{% from "components/icon.html" import detail_icon, icon, sidebar_icon %}

<!-- 移动卡片弹窗 -->
<div x-data="moveCardsModal" x-show="showMoveCardsModal" x-cloak class="modal-overlay z-modal-popover"
    @click.self="showMoveCardsModal = false">
    <div style="background: var(--bg-panel); padding: 0; border-radius: 1rem; width: 90vw; max-width: 400px; border: 1px solid var(--border-light); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); overflow: visible; display: flex; flex-direction: column;">
        <!-- Header -->
        <div style="padding: 1rem 1.25rem; background: var(--bg-sub); border-bottom: 1px solid var(--border-light); border-radius: 1rem 1rem 0 0;">
            <h3 style="font-weight: bold; color: var(--text-main); font-size: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                <span aria-hidden="true">{{ sidebar_icon('folder-open', 'ui-icon--md') }}</span>
                <span>移动到文件夹</span>
            </h3>
        </div>
        
        <div style="padding: 1.25rem;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="font-weight: 500; margin-bottom: 0.5rem; display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.875rem; color: var(--text-main);">
                        <span aria-hidden="true">{{ detail_icon('locate', 'ui-icon--sm') }}</span>
                        <span>选择目标文件夹</span>
                    </label>
                    <div class="icon-select" :class="{ 'is-open': categoryMenuOpen }" @click.outside="categoryMenuOpen = false">
                        <button type="button" class="icon-select-trigger text-sm" :aria-expanded="categoryMenuOpen.toString()"
                            aria-haspopup="listbox" aria-controls="move-category-options"
                            @click="categoryMenuOpen = !categoryMenuOpen"
                            @keydown.arrow-down.prevent="categoryMenuOpen = true"
                            @keydown.escape.stop="categoryMenuOpen = false">
                            <span class="icon-select-trigger-icon" aria-hidden="true">
                                <span x-show="targetCategory === ''" x-cloak>{{ sidebar_icon('folder-open', 'ui-icon--sm') }}</span>
                                <span x-show="targetCategory === '根目录'" x-cloak>{{ icon('folder-root', 'ui-icon--sm') }}</span>
                                <span x-show="targetCategory !== '' && targetCategory !== '根目录'" x-cloak>{{ sidebar_icon('folder-solid', 'ui-icon--sm') }}</span>
                            </span>
                            <span class="icon-select-label" x-text="targetCategory || '(当前浏览目录)'"></span>
                            <span class="icon-select-chevron" aria-hidden="true">{{ icon('chevron-down', 'ui-icon--xs') }}</span>
                        </button>
                        <div id="move-category-options" x-show="categoryMenuOpen" x-cloak class="icon-select-menu"
                            role="listbox" aria-label="选择目标文件夹">
                            <button type="button" role="option" class="icon-select-option"
                                :aria-selected="(targetCategory === '').toString()"
                                @click="targetCategory = ''; categoryMenuOpen = false">
                                <span class="icon-select-option-icon" aria-hidden="true">{{ sidebar_icon('folder-open', 'ui-icon--sm') }}</span>
                                <span class="icon-select-option-label">(当前浏览目录)</span>
                            </button>
                            <button type="button" role="option" class="icon-select-option"
                                :aria-selected="(targetCategory === '根目录').toString()"
                                @click="targetCategory = '根目录'; categoryMenuOpen = false">
                                <span class="icon-select-option-icon" aria-hidden="true">{{ icon('folder-root', 'ui-icon--sm') }}</span>
                                <span class="icon-select-option-label">根目录</span>
                            </button>
                            <template x-for="folder in allFoldersList" :key="folder.path">
                                <button type="button" role="option" class="icon-select-option"
                                    :aria-selected="(targetCategory === folder.path).toString()"
                                    @click="targetCategory = folder.path; categoryMenuOpen = false">
                                    <span class="icon-select-option-icon" aria-hidden="true">{{ sidebar_icon('folder-solid', 'ui-icon--sm') }}</span>
                                    <span class="icon-select-option-label" x-text="folder.path"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem;">
                        将移动 <span x-text="cardIds.length" style="font-weight: bold;"></span> 张卡片
                    </div>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button @click="showMoveCardsModal = false" class="btn-secondary" style="flex:1; justify-content: center; font-size: 0.875rem; padding: 0.5rem;">
                        取消
                    </button>
                    <button @click="executeMove()" class="btn-primary" style="flex:2; justify-content: center; font-size: 0.875rem; padding: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                        <span aria-hidden="true">{{ sidebar_icon('folder-open', 'ui-icon--sm') }}</span>
                        <span>移动</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
