{% from "components/styled_select.html" import styled_select %}

<div x-data="folderOperations">
    <!-- 新建文件夹模态框 -->
    <div x-show="showCreateFolder" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface">
        <div class="ui-small-dialog" role="dialog" aria-modal="true" aria-labelledby="create-folder-title">
            <div class="ui-small-dialog-header"><h3 id="create-folder-title">新建文件夹</h3></div>
            <div class="ui-small-dialog-body"><div class="flex flex-col gap-4">
                {% call styled_select(
                    "newFolderParent",
                    wrapper_class="form-input",
                    aria_label="新建文件夹父目录"
                ) %}
                    <option value="">根目录</option>
                    <template x-for="folder in creatableFolderSelectList" :key="folder.path">
                        <option :value="folder.path" x-text="folder.path"></option>
                    </template>
                {% endcall %}
                <input type="text" x-model="newFolderName" class="form-input" placeholder="文件夹名称">
                <div class="ui-small-dialog-actions">
                    <button type="button" @click="showCreateFolder=false" class="btn-secondary">取消</button>
                    <button type="button" @click="createFolder()" class="btn-primary">创建</button>
                </div>
            </div></div>
        </div>
    </div>

    <!-- 简单的重命名和子文件夹模态框 (略作简化以使用标准样式) -->
    <div x-show="folderRenameModal.visible" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface">
        <div class="ui-small-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-folder-title">
            <div class="ui-small-dialog-header"><h3 id="rename-folder-title">重命名文件夹</h3></div>
            <div class="ui-small-dialog-body"><div class="flex flex-col gap-2">
                <div style="color: var(--content-muted); font-size: 0.875rem;" x-text="folderRenameModal.path"></div>
                <input type="text" x-model="folderRenameModal.name" class="form-input">
                <div class="ui-small-dialog-actions"><button type="button" @click="folderRenameModal.visible = false"
                        class="btn-secondary flex-1">取消</button><button @click="renameFolder()"
                        class="btn-primary flex-1 rounded">确定</button></div>
            </div></div>
        </div>
    </div>

    <div x-show="folderCreateSubModal.visible" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface">
        <div class="ui-small-dialog" role="dialog" aria-modal="true" aria-labelledby="create-subfolder-title">
            <div class="ui-small-dialog-header"><h3 id="create-subfolder-title">创建子分类</h3></div>
            <div class="ui-small-dialog-body"><div class="flex flex-col gap-2">
                <div style="color: var(--content-muted); font-size: 0.875rem;"
                    x-text="folderCreateSubModal.parentPath || '根目录'">
                </div>
                <input type="text" x-model="folderCreateSubModal.name" class="form-input">
                <div class="ui-small-dialog-actions"><button type="button" @click="folderCreateSubModal.visible = false"
                        class="btn-secondary flex-1">取消</button><button @click="createSubFolder()"
                        class="btn-primary flex-1 rounded">创建</button></div>
            </div></div>
        </div>
    </div>
</div>
