{% from "components/icon.html" import icon, sidebar_icon, detail_icon %}
{% from "components/styled_select.html" import styled_select %}

<!-- 自动化规则管理器 -->
<div x-show="showAutomationModal" x-data="automationModal" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-std"
    @click.self="closeModal()">
    <div class="modal-container ui-modal-shell automation-container" role="dialog" aria-modal="true"
        aria-labelledby="automation-modal-title">

        <!-- 移动端：侧边栏切换按钮 -->
        <button x-show="$store.global.deviceType === 'mobile' && !showMobileSidebar" 
            @click="showMobileSidebar = true"
            class="fixed bottom-16 left-2 z-50 w-10 h-10 bg-[var(--surface-container)] border border-[var(--border-default)] rounded-lg flex items-center justify-center text-[var(--content-primary)] shadow-lg md:hidden"
            title="打开规则集列表" aria-label="打开规则集列表">
            <span aria-hidden="true">{{ icon('list', 'ui-icon--sm') }}</span>
        </button>

        <!-- 移动端：侧边栏遮罩 -->
        <div x-show="$store.global.deviceType === 'mobile' && showMobileSidebar"
            @click="showMobileSidebar = false"
            class="fixed inset-0 color-surface-scrim z-40"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"></div>

        <!-- 左侧：规则集列表 -->
        <aside class="automation-sidebar custom-scrollbar"
            :class="{
                'hidden md:flex': $store.global.deviceType !== 'mobile',
                'fixed top-0 left-0 bottom-0 z-50 w-[280px] max-w-[85vw] shadow-2xl flex': $store.global.deviceType === 'mobile' && showMobileSidebar,
                'hidden': $store.global.deviceType === 'mobile' && !showMobileSidebar
            }"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="transform -translate-x-full"
            x-transition:enter-end="transform translate-x-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="transform translate-x-0"
            x-transition:leave-end="transform -translate-x-full">
            <!-- 头部保持不变 -->
            <div
                class="p-3 border-b border-[var(--border-default)] flex justify-between items-center bg-[var(--surface-container)]">
                <span id="automation-modal-title" class="font-bold text-sm">规则集</span>
                <div class="flex gap-1">
                    <button @click="$refs.importInput.click()" class="btn-secondary px-2 py-1 text-xs"
                        title="导入规则集" aria-label="导入规则集">
                        {{ icon('file-import', 'ui-icon--sm') }}
                    </button>
                    <button @click="createNewRuleSet(); if($store.global.deviceType === 'mobile') showMobileSidebar = false" 
                        class="btn-secondary px-2 py-1 text-xs flex items-center gap-1" title="新建规则集">
                        {{ icon('plus-square', 'ui-icon--sm') }}<span>新建</span>
                    </button>
                </div>
                <input type="file" x-ref="importInput" style="display:none" accept=".json"
                    @change="handleImportRuleSet">
            </div>

            <div
                class="px-3 py-2 border-b border-[var(--border-default)] bg-[var(--surface-container-raised)] text-xs flex justify-between items-center">
                <span class="text-[var(--content-muted)]">全局规则:</span>
                <template x-if="globalRulesetId">
                    <span class="color-text-warning font-bold flex items-center gap-1">
                        <span aria-hidden="true">{{ icon('workflow', 'ui-icon--sm') }}</span>
                        <span x-text="ruleSets.find(r=>r.id===globalRulesetId)?.meta?.name || '未知'"></span>
                    </span>
                </template>
                <template x-if="!globalRulesetId">
                    <span class="text-[var(--content-muted)]">未设置 (禁用)</span>
                </template>
            </div>

            <div class="flex-1 overflow-y-auto">
                <template x-for="rs in ruleSets" :key="rs.id">
                    <div class="ruleset-item" :class="activeRuleSet?.id === rs.id ? 'active' : ''"
                        @click="selectRuleSet(rs.id); if($store.global.deviceType === 'mobile') showMobileSidebar = false">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm truncate" x-text="rs.meta.name || '未命名规则集'"></span>

                            <!-- 修复点：这里原来错误地使用了 activeRuleSet.id，改为 rs.id -->
                            <!-- 同时添加 .stop 修饰符防止触发父级点击 -->
                            <button @click.stop="toggleGlobalActive(rs.id)"
                                class="text-xs px-3 py-1 rounded border transition-all flex items-center gap-1" :class="globalRulesetId === rs.id 
                                    ? 'color-surface-warning-solid color-text-on-light color-border-warning font-bold shadow-md'
                                    : 'color-border-default color-text-muted color-hover-border-warning color-hover-text-warning'">
                                <span aria-hidden="true">{{ icon('workflow', 'ui-icon--xs') }}</span>
                                <span x-text="globalRulesetId === rs.id ? '已激活全局' : '设为全局'"></span>
                            </button>
                        </div>
                        <div class="ruleset-meta flex justify-between">
                            <span x-text="'v' + (rs.meta.version || '1.0')"></span>
                            <span x-text="rs.rule_count + ' rules'"></span>
                        </div>
                    </div>
                </template>
                <div x-show="ruleSets.length===0" class="p-4 text-center text-xs text-[var(--content-muted)]">暂无规则集</div>
            </div>
        </aside>

        <!-- 右侧：编辑器 -->
        <!-- 使用 x-if 确保 activeRuleSet 为空时不渲染内部 DOM，彻底避免报错 -->
        <template x-if="activeRuleSet">
            <main class="automation-content relative">
                <!-- 关闭按钮 -->
                <button @click="closeModal()" 
                    class="ui-close-button absolute top-2 right-2 z-50"
                    title="关闭" aria-label="关闭">
                    {{ icon('close', 'ui-icon--sm') }}
                </button>

                <!-- 1. 顶部元数据栏 -->
                <div class="auto-header flex-col items-stretch gap-2">

                    <!-- 全局状态提示条 -->
                    <div x-show="activeRuleSet?.id && globalRulesetId === activeRuleSet?.id"
                        class="color-surface-warning border color-border-warning rounded px-3 py-2 flex justify-between items-center transition-all duration-300">
                        <div class="flex items-center gap-2 color-text-warning font-bold text-xs">
                            <span aria-hidden="true">{{ icon('workflow', 'ui-icon--sm') }}</span>
                            <span>当前状态：全局默认规则 (按规则触发时机和动作类型在不同场景执行)</span>
                        </div>
                        <button x-show="$store.global.deviceType !== 'mobile'" @click="toggleGlobalActive(activeRuleSet?.id)"
                            class="text-xs underline color-hover-text-warning cursor-pointer">
                            关闭全局状态
                        </button>
                    </div>

                    <div class="flex justify-between items-center w-full automation-header-content">
                        <div class="flex gap-4 items-center flex-1 automation-header-left">
                            <div class="flex flex-col gap-1 flex-1">
                                <div class="flex items-center gap-2 automation-name-row">
                                    <input type="text" x-model="editingMeta.name"
                                        class="text-lg font-bold bg-transparent border-b border-transparent hover:border-[var(--border-default)] focus:border-[var(--accent-action)] outline-none transition-colors flex-1"
                                        placeholder="规则集名称">

                                    <!-- ?.id 安全访问 -->
                                    <button @click="toggleGlobalActive(activeRuleSet?.id)"
                                        class="text-[10px] px-2 py-1 rounded border transition-colors whitespace-nowrap flex items-center gap-1 automation-global-btn"
                                        :class="(activeRuleSet?.id && globalRulesetId === activeRuleSet?.id)
                                            ? 'color-surface-warning-solid color-text-on-light color-border-warning font-bold shadow-sm'
                                            : 'border-[var(--border-default)] text-[var(--content-muted)] color-hover-border-warning color-hover-text-warning'"
                                        :title="(activeRuleSet?.id && globalRulesetId === activeRuleSet?.id) ? '点击关闭全局' : '设为全局自动规则'">
                                        <span aria-hidden="true">{{ icon('workflow', 'ui-icon--xs') }}</span>
                                        <span
                                            x-text="(activeRuleSet?.id && globalRulesetId === activeRuleSet?.id) ? '已激活' : '设为全局'"></span>
                                    </button>
                                    <!-- 语法帮助按钮；图标自身带圆形元素，不再叠加外边框 -->
                                    <button @click="openHelpTab('conditions')"
                                        class="automation-help-trigger w-7 h-7 flex items-center justify-center rounded-full color-text-muted color-hover-text-accent color-hover-surface-accent transition-colors ml-2"
                                        title="查看规则语法帮助" aria-label="查看规则语法帮助">
                                        {{ icon('settings-help-entry', 'ui-icon--md') }}
                                    </button>
                                </div>
                                <input type="text" x-model="editingMeta.description"
                                    class="text-xs text-[var(--content-muted)] bg-transparent border-b border-transparent hover:border-[var(--border-default)] focus:border-[var(--accent-action)] outline-none w-full"
                                    placeholder="描述...">
                            </div>
                            <div class="flex flex-col gap-1 automation-meta-inputs">
                                <input type="text" x-model="editingMeta.author" class="auto-input text-xs"
                                    placeholder="作者">
                                <input type="text" x-model="editingMeta.version" class="auto-input text-xs"
                                    placeholder="版本">
                            </div>
                        </div>
                        <div class="flex gap-2 automation-header-actions">
                            <button @click="exportCurrentRuleSet()" class="btn-secondary automation-export-btn" title="导出 JSON"
                                aria-label="导出规则集">
                                {{ icon('upload', 'ui-icon--sm') }}
                            </button>
                            <button @click="deleteCurrentRuleSet()"
                                class="btn-secondary color-text-danger color-hover-text-danger px-3 flex items-center gap-1">
                                {{ icon('trash', 'ui-icon--sm') }}<span>删除</span>
                            </button>
                            <button @click="saveCurrentRuleSet()" class="btn-primary px-4 shadow-md flex items-center gap-1">
                                {{ icon('settings-save', 'ui-icon--sm') }}<span>保存</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. 规则列表构建器 -->
                <div class="auto-body custom-scrollbar">

                    <div x-show="editingUsesMetadata()" x-cloak class="automation-performance-notice" role="note">
                        <span class="automation-performance-notice-icon" aria-hidden="true">
                            {{ icon('book-tip', 'ui-icon--sm') }}
                        </span>
                        <div>
                            <strong>已使用元数据条件</strong>
                            <div>元数据条件会逐张读取并解析角色卡原文件，批量执行时可能明显变慢。建议尽量缩小范围，避免对全库进行批量操作。</div>
                        </div>
                    </div>

                    <template x-for="(rule, rIdx) in editingRules" :key="rule.id">
                        <div class="rule-card">
                            <!-- 规则头 -->
                            <div class="rule-header">
                                <div class="flex flex-col gap-2 flex-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <span class="drag-handle cursor-grab">{{ icon('menu-bold', 'ui-icon--xs') }}</span>
                                        <input type="checkbox" x-model="rule.enabled" class="cursor-pointer" title="启用/禁用">
                                        <input type="text" x-model="rule.name"
                                            class="bg-transparent font-bold text-sm outline-none border-b border-transparent color-hover-border-neutral color-focus-border-accent w-64"
                                            placeholder="规则名称...">
                                    </div>
                                    <div class="flex flex-wrap items-center gap-2">
                                        <button type="button" class="automation-preset-chip"
                                            :class="ruleHasTrigger(rule, 'manual_run') ? 'border-[var(--accent-action)] text-[var(--accent-action)]' : 'text-[var(--content-muted)]'"
                                            @click="toggleRuleTrigger(rule, 'manual_run')">
                                            手动执行
                                        </button>
                                        <button type="button" class="automation-preset-chip"
                                            :class="ruleHasTrigger(rule, 'auto_import') ? 'border-[var(--accent-action)] text-[var(--accent-action)]' : 'text-[var(--content-muted)]'"
                                            @click="toggleRuleTrigger(rule, 'auto_import')">
                                            导入后
                                        </button>
                                        <button type="button" class="automation-preset-chip"
                                            :class="ruleHasTrigger(rule, 'card_update') ? 'border-[var(--accent-action)] text-[var(--accent-action)]' : 'text-[var(--content-muted)]'"
                                            @click="toggleRuleTrigger(rule, 'card_update')">
                                            更新角色卡后
                                        </button>
                                        <button type="button" class="automation-preset-chip"
                                            :class="ruleHasTrigger(rule, 'link_update') ? 'border-[var(--accent-action)] text-[var(--accent-action)]' : 'text-[var(--content-muted)]'"
                                            @click="toggleRuleTrigger(rule, 'link_update')">
                                            更新来源链接后
                                        </button>
                                        <button type="button" class="automation-preset-chip"
                                            :class="ruleHasTrigger(rule, 'tag_edit') ? 'border-[var(--accent-action)] text-[var(--accent-action)]' : 'text-[var(--content-muted)]'"
                                            @click="toggleRuleTrigger(rule, 'tag_edit')">
                                            手动打标后
                                        </button>
                                    </div>
                                    <div class="text-[10px] text-[var(--content-muted)]">
                                        仅勾选的触发场景会参与该规则。
                                    </div>
                                </div>
                                <div class="automation-inline-actions">
                                    <label class="flex items-center gap-1 text-xs cursor-pointer select-none"
                                        title="如果命中此规则，不再执行后续规则">
                                        <input type="checkbox" x-model="rule.stop_on_match">
                                        <span class="text-[var(--content-muted)]">命中即停止</span>
                                    </label>
                                    <div class="automation-inline-actions">
                                        <button type="button" @click="moveRule(rIdx, -1)" class="ui-reorder-button" title="上移规则" aria-label="上移规则">{{ icon('arrow-up', 'ui-icon--xs') }}</button>
                                        <button type="button" @click="moveRule(rIdx, 1)" class="ui-reorder-button" title="下移规则" aria-label="下移规则">{{ icon('arrow-down', 'ui-icon--xs') }}</button>
                                        <button @click="deleteRule(rIdx)" class="btn-icon-sm delete" title="删除规则"
                                            aria-label="删除规则">
                                            {{ icon('trash', 'ui-icon--sm') }}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- 规则体 -->
                            <div class="rule-body" x-show="rule.enabled">

                                <!-- IF 区块 (Conditions) -->
                                <div class="logic-block">
                                    <div class="logic-label if flex flex-col items-end gap-1">
                                        <span>IF</span>
                                    </div>

                                    <div class="logic-content gap-3">
                                        <!-- Rule Level Logic (Group Connector) -->
                                        <div
                                            class="flex items-center gap-2 mb-2 p-2 bg-[var(--surface-container-raised)] rounded border border-[var(--border-default)]">
                                            <span class="text-xs font-bold text-[var(--content-muted)]">规则逻辑:</span>
                                            {% call styled_select(
                                                "rule.logic",
                                                wrapper_class="auto-select icon-select--compact",
                                                trigger_class="icon-select-trigger--tiny text-xs",
                                                menu_class="icon-select-menu--fit",
                                                aria_label="规则逻辑"
                                            ) %}
                                                <option value="OR">满足任意一个条件组 (OR)</option>
                                                <option value="AND">必须满足所有条件组 (AND)</option>
                                            {% endcall %}
                                            <span class="text-xs text-[var(--content-muted)]">时触发动作</span>
                                        </div>
                                        <!-- 遍历 Groups -->
                                        <template x-for="(group, gIdx) in rule.groups" :key="group.id">
                                            <div
                                                class="relative border border-[var(--border-default)] rounded-lg p-2 bg-[var(--surface-container-raised)]">

                                                <!-- Group Header & Logic -->
                                                <div
                                                    class="flex justify-between items-center mb-2 pb-1 border-b border-[var(--border-default)] border-dashed">
                                                    <div class="flex items-center gap-2">
                                                        <span class="text-xs font-bold text-[var(--content-muted)]"
                                                            x-text="'条件组 ' + (gIdx+1)"></span>
                                                        {% call styled_select(
                                                            "group.logic",
                                                            wrapper_class="auto-select icon-select--compact",
                                                            trigger_class="icon-select-trigger--tiny text-xs",
                                                            menu_class="icon-select-menu--fit",
                                                            aria_label="条件组逻辑"
                                                        ) %}
                                                            <option value="AND">且 (AND)</option>
                                                            <option value="OR">或 (OR)</option>
                                                        {% endcall %}
                                                    </div>
                                                    <div class="automation-inline-actions">
                                                        <button type="button" @click="moveGroup(rIdx, gIdx, -1)" class="ui-reorder-button" title="上移条件组" aria-label="上移条件组">{{ icon('arrow-up', 'ui-icon--xs') }}</button>
                                                        <button type="button" @click="moveGroup(rIdx, gIdx, 1)" class="ui-reorder-button" title="下移条件组" aria-label="下移条件组">{{ icon('arrow-down', 'ui-icon--xs') }}</button>
                                                        <button @click="removeGroup(rIdx, gIdx)"
                                                            class="text-[10px] color-text-danger color-hover-text-danger px-2 py-1 rounded color-hover-surface-danger">删除组</button>
                                                    </div>
                                                </div>

                                                <!-- Conditions List -->
                                                <div class="flex flex-col gap-1">
                                                    <template x-for="(cond, cIdx) in group.conditions" :key="cIdx">
                                                        <div class="logic-row bg-[var(--surface-container)]">
                                                            <!-- 字段选择 -->
                                                            {% call styled_select(
                                                                "cond.field",
                                                                wrapper_class="auto-select icon-select--compact w-32",
                                                                trigger_class="icon-select-trigger--tiny text-xs",
                                                                menu_class="icon-select-menu--fit",
                                                                aria_label="条件字段"
                                                            ) %}
                                                                <optgroup label="基础信息">
                                                                    <option value="char_name">角色名 (Name)</option>
                                                                    <option value="filename">文件名 (Filename)</option>
                                                                    <option value="creator">创作者 (Creator)</option>
                                                                    <option value="char_version">版本 (Version)</option>
                                                                    <option value="tags">标签 (Tags)</option>
                                                                </optgroup>

                                                                <optgroup label="核心文本">
                                                                    <option value="description">简介 (Description)
                                                                    </option>
                                                                    <option value="first_mes">开场白 (First Mes)</option>
                                                                    <option value="alternate_greetings">备用开场白 (Alt
                                                                        Greetings)</option>
                                                                    <option value="mes_example">对话示例 (Mes Example)
                                                                    </option>
                                                                </optgroup>

                                                                <optgroup label="设定与提示词">
                                                                    <option value="personality">人格设定 (Personality)
                                                                    </option>
                                                                    <option value="scenario">场景设定 (Scenario)</option>
                                                                    <option value="creator_notes">作者注释 (Creator Notes)
                                                                    </option>
                                                                    <option value="system_prompt">系统提示词 (Sys Prompt)
                                                                    </option>
                                                                    <option value="post_history_instructions">历史指令 (Post
                                                                        History)</option>
                                                                </optgroup>

                                                                <optgroup label="高级扩展">
                                                                    <option value="wi_name">世界书条目名称</option>
                                                                    <option value="wi_content">世界书条目内容</option>
                                                                    <option value="regex_name">正则脚本名称</option>
                                                                    <option value="regex_content">正则脚本内容</option>
                                                                    <option value="st_script_name">ST Helper 脚本名
                                                                    </option>
                                                                    <option value="st_script_content">ST Helper 内容
                                                                    </option>
                                                                </optgroup>

                                                                <optgroup label="系统属性">
                                                                    <option value="ui_summary">本地备注 (Local Note)
                                                                    </option>
                                                                    <option value="source_link">来源链接 (Source Link)
                                                                    </option>
                                                                    <option value="is_favorite">是否收藏 (Is Fav)</option>
                                                                    <option value="token_count">Token 数</option>
                                                                    <option value="file_size">文件大小</option>
                                                                </optgroup>

                                                                <optgroup label="元数据（可能较慢）">
                                                                    <option value="metadata">原始元数据</option>
                                                                </optgroup>
                                                            {% endcall %}

                                                            <input
                                                                x-show="cond.field === 'metadata'"
                                                                x-model="cond.metadata_path"
                                                                type="text"
                                                                class="auto-input metadata-path-input"
                                                                placeholder="元数据路径（可选，如 data.extensions.foo）"
                                                                title="留空搜索完整元数据；支持点号路径和 [数组下标]"
                                                            >

                                                            <!-- 操作符 -->
                                                            {% call styled_select(
                                                                "cond.operator",
                                                                wrapper_class="auto-select icon-select--compact w-28",
                                                                trigger_class="icon-select-trigger--tiny text-xs",
                                                                menu_class="icon-select-menu--fit",
                                                                aria_label="条件操作符"
                                                            ) %}
                                                                <option value="contains">包含</option>
                                                                <option value="not_contains">不包含</option>
                                                                <option value="eq">等于</option>
                                                                <option value="neq">不等于</option>
                                                                <option value="regex">正则匹配</option>
                                                                <option value="exists">有内容</option>
                                                                <option value="not_exists">为空</option>
                                                                <option value="gt">大于</option>
                                                                <option value="lt">小于</option>
                                                                <option value="is_true">是 (True)</option>
                                                                <option value="is_false">否 (False)</option>
                                                            {% endcall %}

                                                            <!-- 值 -->
                                                            <div class="flex-1">
                                                                <input
                                                                    x-show="['exists','not_exists','is_true','is_false'].indexOf(cond.operator) === -1"
                                                                    type="text" x-model="cond.value"
                                                                    class="auto-input w-full">
                                                            </div>

                                                            <div class="automation-inline-actions">
                                                                <button type="button" @click="moveConditionInGroup(rIdx, gIdx, cIdx, -1)" class="ui-reorder-button" title="上移条件" aria-label="上移条件">{{ icon('arrow-up', 'ui-icon--xs') }}</button>
                                                                <button type="button" @click="moveConditionInGroup(rIdx, gIdx, cIdx, 1)" class="ui-reorder-button" title="下移条件" aria-label="下移条件">{{ icon('arrow-down', 'ui-icon--xs') }}</button>
                                                                    <button type="button" @click="removeConditionFromGroup(rIdx, gIdx, cIdx)"
                                                                    class="btn-icon-sm delete" title="删除条件" aria-label="删除条件">{{ icon('close', 'ui-icon--xs') }}</button>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <button @click="addConditionToGroup(rIdx, gIdx)"
                                                        class="text-xs text-left color-text-accent color-hover-text-accent w-fit mt-1">
                                                        + 添加条件
                                                    </button>
                                                </div>
                                            </div>
                                        </template>

                                        <button @click="addGroup(rIdx)"
                                            class="w-full py-1 text-xs border border-dashed border-[var(--border-default)] text-[var(--content-muted)] color-hover-border-accent color-hover-text-accent rounded transition">
                                            + 新增条件组 (New Group)
                                        </button>
                                    </div>
                                </div>

                                <!-- THEN Actions -->
                                <div class="logic-block">
                                    <div class="logic-label then">THEN</div>
                                    <div class="logic-content">

                                        <div>
                                            <div class="font-bold text-xs color-text-warning mb-1 inline-flex items-center gap-1">
                                                <span aria-hidden="true">{{ detail_icon('tags', 'ui-icon--xs') }}</span>
                                                <span>批量标签动作</span>
                                            </div>
                                            <div class="text-xs text-[var(--content-muted)] mb-1">
                                                在执行 "添加标签" 或 "移除标签" 时，一次性处理多个标签。

                                            <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">
                                                <span class="color-text-violet">Add Tag</span> <span class="color-text-muted">=</span> <span class="color-text-success">female|elf|mage</span>
                                                <br>
                                                <span class="color-text-muted opacity-60">// 同时添加 "female", "elf", "mage" 三个标签</span>
                                                <br>
                                                <span class="color-text-muted opacity-60" x-show="$store.global.settingsForm.automation_slash_is_tag_separator">// 当前已启用 / 分隔，也可写为 female/elf/mage</span>

                                        <div>

                                                <li><strong>fetch_forum_tags</strong>：自动从来源链接抓取论坛标签，可配置排除标签、标签替换、合并模式；不会更新来源标题或首帖时间基线。</li>
                                                <li><strong>refresh_source_baseline</strong>：更新来源链接时同步帖子标题和首帖编辑时间，并将其保存为新的检查基线；与抓取论坛标签同时启用时会合并帖子请求。</li>
                                                <li><strong>add_tags_from_source_title</strong>：用自定义 Python 正则匹配来源帖子标题，按捕获组和分割正则提取标签；结果只追加，不替换已有标签。</li>
                                                <li><strong>set_creator_from_source</strong>：从 Discord 首帖或类脑搜索结果读取作者，按模板填写创作者；可选择作者字段、来源优先级，以及是否覆盖已有创作者。</li>
                                                <li><strong>merge_tags</strong>：将多个旧标签统一替换为同一个目标标签，适合做同义词归并。</li>
                                                <li><strong>rename_file_by_template</strong>：按模板重命名文件，适合把角色名、版本、导入日期或修改日期等字段拼成规范文件名。</li>
                                                <li><strong>split_category_to_tags</strong>：把当前分类路径按 <code class="font-mono">/</code> 拆成多个标签，例如 <code class="font-mono">a/b/c</code> 会追加 <code class="font-mono">a</code>、<code class="font-mono">b</code>、<code class="font-mono">c</code>。</li>

                                        <div class="font-bold text-xs color-text-success mb-2">配置说明：</div>
                                        <ul class="list-disc list-inside space-y-1 text-xs text-[var(--content-muted)]">
                                            <li><strong>排除标签</strong>：填写不需要的标签，默认用 <code class="font-mono color-text-warning">|</code> 分隔<span x-show="$store.global.settingsForm.automation_slash_is_tag_separator">，也支持 /</span></li>
                                            <li><strong>标签替换</strong>：格式为"原标签→新标签"，多个规则默认用 <code class="font-mono color-text-warning">|</code> 分隔<span x-show="$store.global.settingsForm.automation_slash_is_tag_separator">，也支持 /</span></li>
                                            <li><strong>合并模式</strong>：选择"合并"保留现有标签，或"替换"清空后添加</li>

                                        <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono mt-2">
                                            <span class="color-text-violet">示例</span><br>
                                            <span x-text="$store.global.settingsForm.automation_slash_is_tag_separator ? '排除标签: 其他/待审核' : '排除标签: 其他|待审核'"></span><br>
                                            <span x-text="$store.global.settingsForm.automation_slash_is_tag_separator ? '标签替换: 其他→杂项/调教→BDSM' : '标签替换: 其他→杂项|调教→BDSM'"></span><br>

                                <div>
                                    <h4 class="font-bold text-[var(--accent-action)] mb-2 text-base">来源标题提取标签</h4>
                                    <p class="text-[var(--content-muted)] mb-3">
                                        该动作支持自定义正则逻辑，不限制为固定的括号格式。正则对来源帖子标题执行，匹配到的捕获组会再按分割正则拆成标签。

                                    <div class="bg-[var(--surface-container-raised)] rounded border border-[var(--border-default)] p-3 space-y-2">

                                        <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">
                                            正则：<span class="color-text-violet">(?:【|\[)([^】\]]+)(?:】|\])</span><br>
                                            捕获组：<span class="color-text-success">1</span>　分割正则：<span class="color-text-success">[/|]</span><br>
                                            结果：<span class="color-text-warning">a、b、c、d</span>
                                        </div>
                                        <div class="font-bold text-xs color-text-success">示例 2：自定义标题格式 <code class="font-mono">作者:abcd 标签:a/b</code></div>
                                        <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">
                                            正则：<span class="color-text-violet">标签[:：]([^\s]+)</span><br>
                                            捕获组：<span class="color-text-success">1</span>　分割正则：<span class="color-text-success">[/]</span><br>
                                            结果：追加标题中标签字段拆出的各个标签，并继续经过标签黑名单和标签库锁定检查。
                                        </div>
                                        <div class="text-[10px] text-[var(--content-muted)]">
                                            捕获组填写 <code class="font-mono">0</code> 表示完整匹配，也可以填写多个编号或命名组（如 <code class="font-mono">1,2</code>、<code class="font-mono">tag,genre</code>）；正则标记支持 <code class="font-mono">i</code>、<code class="font-mono">m</code>、<code class="font-mono">s</code>、<code class="font-mono">x</code>。
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h4 class="font-bold text-[var(--accent-action)] mb-2 text-base">来源作者填写创作者</h4>

                                        来源作者优先从 Discord 首帖读取；自动模式下 Discord 没有作者时再尝试类脑搜索。类脑搜索需要配置可用的论坛 Cookie。
                                    </p>
                                    <div class="bg-[var(--surface-container-raised)] rounded border border-[var(--border-default)] p-3 space-y-2">
                                        <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">
                                            来源作者账号名：<span class="color-text-success">abcd</span><br>
                                            格式：<span class="color-text-violet">&#123;&#123;author&#125;&#125;</span>　结果：<span class="color-text-warning">abcd</span><br>
                                            格式：<span class="color-text-violet">&#123;&#123;author&#125;&#125;@&#123;&#123;author&#125;&#125;</span>　结果：<span class="color-text-warning">abcd@abcd</span>
                                        </div>
                                        <div class="text-xs text-[var(--content-muted)]">
                                            未勾选“覆盖当前角色卡创作者”时，只有当前创作者为空才会填写；勾选后每次来源链接更新都会用新结果覆盖。支持变量 <code class="font-mono">&#123;&#123;author&#125;&#125;</code>、<code class="font-mono">&#123;&#123;username&#125;&#125;</code>、<code class="font-mono">&#123;&#123;display_name&#125;&#125;</code>、<code class="font-mono">&#123;&#123;global_name&#125;&#125;</code>、<code class="font-mono">&#123;&#123;author_id&#125;&#125;</code>、<code class="font-mono">&#123;&#123;title&#125;&#125;</code> 和 <code class="font-mono">&#123;&#123;source_url&#125;&#125;</code>。
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section x-show="helpActiveTab === 'triggers'" id="automation-help-panel-triggers"
                                role="tabpanel" aria-labelledby="automation-help-tab-triggers"
                                class="automation-help-panel space-y-6">
                                <div>
                                    <h4 class="font-bold text-[var(--accent-action)] mb-2 text-base">触发时机</h4>
                                    <p class="text-[var(--content-muted)] mb-3">
                                        全局规则不是每个入口都执行全部动作。不同触发场景只会运行对应的动作子集，避免在不合适的场景里改名或改标签。
                                    </p>
                                    <div class="p-3 color-surface-accent border color-border-accent rounded">
                                            <ul class="list-disc list-inside space-y-1 text-xs text-[var(--content-muted)]">
                                                <li><strong>导入时</strong>：会执行普通动作（移动文件夹、添加/移除标签、设置收藏、名称同步、rename_file_by_template、split_category_to_tags）；导入时会跳过抓取论坛标签与标签合并。</li>
                                                <li><strong>更新角色卡后</strong>：仅在 upload-file 或 update-from-URL 用新角色卡内容覆盖已有角色卡时触发；普通保存详情、单独更换封面、修改本地备注、修改来源链接都不会触发。</li>
                                                <li><strong>更新链接时只执行抓取论坛标签</strong>这一旧版说明现已扩展：在卡片详情页修改"来源链接"并保存后，会执行 <strong>fetch_forum_tags</strong>、<strong>refresh_source_baseline</strong>、<strong>add_tags_from_source_title</strong>、<strong>set_creator_from_source</strong>；其中论坛标签、标题提取和作者填写会共用来源请求。链接未发生变化时不会重复触发。</li>
                                                <li><strong>来源动作的生效前提</strong>：必须存在当前全局启用的规则集，且动作位于启用规则中；对应规则还需要包含 <code class="font-mono">link_update</code> 触发场景。未启用规则集、禁用规则或未配置来源动作时不会访问论坛。</li>
                                                <li><strong>手动打标时</strong>：仅在"批量标签管理输入框"和"详情页自定义添加标签输入框"点击添加时触发；手动打标时只执行标签合并。</li>
                                            </ul>
                                    </div>
                                </div>

                                            <p class="text-[var(--content-muted)] mt-1">匹配你在 ST Manager 中填写的私有备注。</p>
                                        </div>
                                    </div>

                                role="tabpanel" aria-labelledby="automation-help-tab-templates"
                                class="automation-help-panel space-y-6">
                                <div>
                                    <h4 class="font-bold text-[var(--accent-action)] mb-2 text-base">模板语法</h4>
                                    <p class="text-[var(--content-muted)] mb-3">
                                        <code class="font-mono">rename_file_by_template</code> 会把 <code class="font-mono">{% raw %}{{...}}{% endraw %}</code> 里的字段替换成当前卡片数据。<code class="font-mono">split_category_to_tags</code> 不读取模板，只会按当前分类路径拆分标签。
                                    </p>
                                    <div class="automation-template-cheatsheet text-xs mb-3">
                                        <span class="font-bold text-[var(--content-primary)]">字段写法：</span>
                                        <code class="font-mono">{% raw %}{{field}}{% endraw %}</code>
                                        <span class="mx-2 text-[var(--content-muted)]">|</span>
                                        <span class="font-bold text-[var(--content-primary)]">过滤器写法：</span>
                                        <code class="font-mono">{% raw %}{{field|filter}}{% endraw %}</code>
                                        <span class="mx-2 text-[var(--content-muted)]">|</span>
                                        <span class="font-bold text-[var(--content-primary)]">带参数过滤器：</span>
                                        <code class="font-mono">{% raw %}{{field|filter:param}}{% endraw %}</code>
                                    </div>
                                    <div class="bg-[var(--surface-container-raised)] rounded border border-[var(--border-default)] p-3 space-y-3">
                                        <div class="automation-template-reference-grid">
                                            <div class="automation-template-reference-column">
                                                <div class="font-bold text-xs color-text-accent mb-1">支持字段</div>
                                                <div class="text-xs text-[var(--content-muted)] mb-2">
                                                    支持字段：char_name、char_version、filename、filename_stem、category、import_time、import_date、modified_time、modified_date
                                                </div>
                                                <div class="automation-template-field-grid grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">char_name</div>
                                                        <div class="text-[var(--content-muted)] mt-1">角色卡名</div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">char_version</div>
                                                        <div class="text-[var(--content-muted)] mt-1">角色卡版本文本，可配合 <code class="font-mono">version</code> 清洗</div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">filename</div>
                                                        <div class="text-[var(--content-muted)] mt-1">当前文件名（含扩展名）</div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">filename_stem</div>
                                                        <div class="text-[var(--content-muted)] mt-1">当前文件名（不含扩展名）</div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">category</div>
                                                        <div class="text-[var(--content-muted)] mt-1">当前分类路径，如 <code class="font-mono">a/b</code></div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-accent">import_time / import_date</div>
                                                        <div class="text-[var(--content-muted)] mt-1">导入时间戳 / 导入日期，更适合首次导入时命名</div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)] md:col-span-2">
                                                        <div class="font-bold color-text-accent">modified_time / modified_date</div>
                                                        <div class="text-[var(--content-muted)] mt-1">文件修改时间戳 / 文件修改日期，更适合覆盖更新后命名</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="automation-template-reference-column">
                                                <div class="font-bold text-xs color-text-accent mb-1">支持过滤器</div>
                                                <div class="text-xs text-[var(--content-muted)]">
                                                    支持 <code class="font-mono">trim</code>、<code class="font-mono">default</code>、<code class="font-mono">limit</code>、<code class="font-mono">date</code>、<code class="font-mono">version</code>。日期字段支持 <code class="font-mono">date</code> 过滤器，例如 <code class="font-mono">date:%Y-%m-%d</code> 或 <code class="font-mono">date:%Y%m%d</code>。
                                                </div>
                                                <div class="text-xs text-[var(--content-muted)] mt-1">
                                                    日期字段支持 date 过滤器。
                                                </div>
                                                <div class="automation-template-filter-list space-y-2 mt-3 text-xs">
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-success">trim：去掉首尾空格</div>
                                                        <div class="font-mono mt-1">{% raw %}{{char_name|trim}}{% endraw %}</div>
                                                        <div class="text-[var(--content-muted)] mt-1">示例：<code class="font-mono">"  Alice  "</code> -> <code class="font-mono">"Alice"</code></div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-success">default：为空时使用备用值</div>
                                                        <div class="font-mono mt-1">{% raw %}{{char_version|default:unknown}}{% endraw %}</div>
                                                        <div class="text-[var(--content-muted)] mt-1">示例：空版本 -> <code class="font-mono">unknown</code></div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-success">limit：截断过长文本</div>
                                                        <div class="font-mono mt-1">{% raw %}{{filename_stem|limit:20}}{% endraw %}</div>
                                                        <div class="text-[var(--content-muted)] mt-1">示例：<code class="font-mono">very-long-character-name-demo</code> -> <code class="font-mono">very-long-character-</code></div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-success">date：格式化导入时间或修改时间</div>
                                                        <div class="font-mono mt-1">{% raw %}{{import_date|date:%Y-%m-%d}}{% endraw %}</div>
                                                        <div class="text-[var(--content-muted)] mt-1">示例：时间戳 -> <code class="font-mono">2026-04-01</code></div>
                                                    </div>
                                                    <div class="p-2 border border-[var(--border-default)] rounded bg-[var(--surface-container)]">
                                                        <div class="font-bold color-text-success">version：从版本文本里提取主版本号</div>
                                                        <div class="font-mono mt-1">{% raw %}{{char_version|version}}{% endraw %}</div>
                                                        <div class="text-[var(--content-muted)] mt-1">示例：<code class="font-mono">Version 1.2 beta by author</code> -> <code class="font-mono">v1.2</code></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="font-bold text-xs color-text-success mb-1">文件重命名示例</div>
                                            <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">{% raw %}{{char_name}} - {{char_version|version}} - {{modified_date|date:%Y-%m-%d}}{% endraw %}</div>
                                            <div class="text-xs text-[var(--content-muted)] mt-1">例如生成“角色名 - v1.2 - 2026-04-01”这种文件名；import_date 更适合首次导入时命名，modified_date 更适合覆盖更新后命名。</div>
                                        </div>
                                        <div>
                                            <div class="font-bold text-xs color-text-success mb-1">拆分类标签示例</div>
                                            <div class="bg-[var(--surface-code)] p-2 rounded text-xs font-mono">category = a/b/c  ->  tags += [a, b, c]</div>
                                            <div class="text-xs text-[var(--content-muted)] mt-1"><code class="font-mono">split_category_to_tags</code> 不读取模板，也不会使用回退模板或最大长度；它只是把当前分类路径按 <code class="font-mono">/</code> 拆成多个标签。</div>
                                        </div>
                                        <div>
                                            <div class="font-bold text-xs color-text-accent mb-1">补救模板与长度限制</div>
                                            <ul class="list-disc list-inside space-y-1 text-xs text-[var(--content-muted)]">
                                                <li>主模板结果为空时，会尝试使用 fallback 模板。</li>
                                                <li>文件名模板建议只拼接必要字段，并配合最大长度限制避免过长文件名。</li>
                                                <li>分类拆分动作可结合“排除分类标签”过滤不想保留的类别词。</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        <!-- 底部 -->
                        <div class="p-4 border-t border-[var(--border-default)] bg-[var(--surface-container-raised)] flex justify-end">
                            <button @click="showHelpModal = false" class="btn-primary px-6 py-2 rounded shadow-md">
                                明白了
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </template>

        <!-- 空状态 -->
        <div x-show="!activeRuleSet" class="flex-1 flex flex-col items-center justify-center text-[var(--content-muted)] relative">
            <!-- 关闭按钮（空状态时也显示） -->
            <button @click="closeModal()" 
                class="absolute top-2 right-2 z-50 w-8 h-8 bg-[var(--surface-container)] border border-[var(--border-default)] rounded-lg flex items-center justify-center text-[var(--content-primary)] hover:bg-[var(--state-hover-surface)] color-hover-text-danger transition-colors shadow-lg"
                title="关闭" aria-label="关闭">
                {{ icon('close', 'ui-icon--sm') }}
            </button>
            <div class="automation-empty-icon mb-4 opacity-20" aria-hidden="true">
                {{ icon('workflow', 'ui-icon--3xl') }}
            </div>
            <p>请从左侧选择一个规则集，或新建一个</p>
        </div>
    </div>
</div>
