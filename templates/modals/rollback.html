{% from "components/icon.html" import icon %}

<!-- 回滚/时光机模态框 -->
<div x-show="showRollbackModal" x-data="rollbackModal" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-popover" @click.self="showRollbackModal=false">
    <div class="rollback-modal-container ui-modal-shell" role="dialog" aria-modal="true" aria-label="版本回滚与对比">

        <!-- 1. Header -->
        <div class="rb-header">
            <div class="flex items-center gap-3">
                <span aria-hidden="true">{{ icon('history-rollback', 'ui-icon--lg') }}</span>
                <div>
                    <h3 class="font-bold text-lg">时光机 (Time Machine)</h3>
                    <p class="text-xs text-[var(--content-muted)]">选择两个版本进行比对，或恢复历史版本</p>
                </div>
            </div>
            <button type="button" @click="showRollbackModal=false" class="ui-close-button" title="关闭回滚弹窗" aria-label="关闭回滚弹窗">
                {{ icon('close', 'ui-icon--md') }}
            </button>
        </div>

        <!-- 2. Body Grid -->
        <div class="rb-body">

            <!-- Left: Version List -->
            <div class="rb-sidebar custom-scrollbar">
                <div class="rb-sidebar-header">
                    <div class="w-8 text-center color-text-danger font-bold" title="Diff 左侧 (旧)">L</div>
                    <div class="w-8 text-center color-text-success font-bold" title="Diff 右侧 (新)">R</div>
                    <div class="flex-1 text-xs font-bold uppercase text-[var(--content-muted)]">版本时间 / 备注</div>
                </div>

                <template x-for="ver in rollbackVersions" :key="ver.path || 'current'">
                    <div class="rb-item"
                        :class="{'bg-[var(--state-hover-surface)]': diffSelection.left === ver || diffSelection.right === ver}">

                        <!-- Radio: Left Selection -->
                        <div class="w-8 flex justify-center" @click.stop>
                            <input type="radio" name="diff-left" :checked="diffSelection.left === ver"
                                @change="setDiffSide('left', ver)" class="cursor-pointer color-accent-danger">
                        </div>

                        <!-- Radio: Right Selection -->
                        <div class="w-8 flex justify-center" @click.stop>
                            <input type="radio" name="diff-right" :checked="diffSelection.right === ver"
                                @change="setDiffSide('right', ver)" class="cursor-pointer color-accent-success">
                        </div>

                        <!-- Info -->
                        <div class="flex-1 min-w-0 py-2 cursor-pointer" @click="setDiffSide('left', ver)">
                            <div class="flex items-center flex-wrap gap-2">
                                <span class="text-sm font-mono"
                                    x-text="ver.is_current ? '当前版本 (Current)' : new Date(ver.mtime * 1000).toLocaleString()"></span>

                                <!-- AUTO 徽章：使用紫色背景 -->
                                <span x-show="ver.is_auto"
                                    class="text-[10px] color-surface-violet color-text-violet px-1.5 py-0.5 rounded font-bold border color-border-violet shadow-sm"
                                    title="自动保存的快照">AUTO</span>

                                <!-- KEY 徽章：使用琥珀色背景 -->
                                <span x-show="ver.is_key"
                                    class="text-[10px] color-surface-warning-solid color-text-on-light px-1.5 py-0.5 rounded font-bold border color-border-warning"
                                    x-text="ver.label"></span>

                                <!-- LIVE 徽章 -->
                                <span x-show="ver.is_current"
                                    class="text-[10px] color-surface-accent-solid color-text-on-accent px-1.5 py-0.5 rounded border color-border-accent">LIVE</span>
                            </div>
                            <div class="text-[10px] text-[var(--content-muted)] mt-0.5" x-show="!ver.is_current">
                                Size: <span x-text="(ver.size/1024).toFixed(1)"></span> KB
                            </div>
                        </div>

                        <!-- Action: Restore -->
                        <button x-show="!ver.is_current"
                            @click.stop="selectedBackup=ver; diffSelection.left=ver; performRestore()"
                            class="px-2 py-1 text-xs border border-[var(--border-default)] rounded color-hover-surface-danger text-[var(--content-secondary)] color-hover-text-danger transition ml-2">
                            <span class="inline-flex items-center gap-1">
                                <span aria-hidden="true">{{ icon('history-rollback', 'ui-icon--sm') }}</span>
                                <span>恢复</span>
                            </span>
                        </button>
                    </div>
                </template>
            </div>

            <!-- Right: Diff Viewer -->
            <div class="rb-diff-area relative">
                <div class="diff-header">
                    <div class="diff-header-item color-text-danger flex items-center justify-center gap-2">
                        <span class="inline-flex items-center gap-1">
                            <span class="inline-block h-2.5 w-2.5 rounded-full color-surface-danger-solid" aria-hidden="true"></span>
                            <span>Left (Old)</span>
                        </span>
                        <span class="text-xs text-[var(--content-muted)]"
                            x-text="diffSelection.left ? (diffSelection.left.is_current ? 'Current' : new Date(diffSelection.left.mtime*1000).toLocaleString()) : '-'"></span>
                    </div>
                    <div class="diff-header-item color-text-success flex items-center justify-center gap-2">
                        <span class="inline-flex items-center gap-1">
                            <span class="inline-block h-2.5 w-2.5 rounded-full color-surface-success-solid" aria-hidden="true"></span>
                            <span>Right (New)</span>
                        </span>
                        <span class="text-xs text-[var(--content-muted)]"
                            x-text="diffSelection.right ? (diffSelection.right.is_current ? 'Current' : new Date(diffSelection.right.mtime*1000).toLocaleString()) : '-'"></span>
                    </div>
                </div>
                <div class="px-3 py-1 text-[11px] border-b border-[var(--border-default)] bg-[var(--surface-container-raised)] text-[var(--content-muted)]">
                    <span x-show="diffRenderMode === 'wi_entries'">当前视图: 按世界书条目对比（仅显示变更条目）</span>
                    <span x-show="diffRenderMode !== 'wi_entries'">当前视图: 原始 JSON 文本对比</span>
                </div>

                <div class="diff-container" id="diff-scroll-container">
                    <div class="diff-pane custom-scrollbar" id="diff-left"
                        @scroll="document.getElementById('diff-right').scrollTop = $el.scrollTop">
                        <div x-html="diffData.left"></div>
                    </div>
                    <div class="diff-pane custom-scrollbar" id="diff-right"
                        @scroll="document.getElementById('diff-left').scrollTop = $el.scrollTop">
                        <div x-html="diffData.right"></div>
                    </div>
                </div>

                <!-- Loading 遮罩 -->
                <div x-show="isDiffLoading" x-transition.opacity.duration.200ms
                    class="absolute inset-0 z-10 flex items-center justify-center backdrop-blur-sm color-surface-scrim-soft">
                    <div
                        class="bg-[var(--surface-container)] border border-[var(--border-default)] px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
                        <span aria-hidden="true">{{ icon('loader-circle', 'ui-icon--sm ui-icon--spin') }}</span>
                        <span class="text-sm font-bold">正在比对差异...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
