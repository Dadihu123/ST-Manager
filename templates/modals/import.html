{% from "components/icon.html" import detail_icon, icon, sidebar_icon %}

<!-- URL 导入模态框 -->
<div x-data="importModal" x-show="showImportUrlModal" x-cloak class="modal-overlay ui-modal-overlay ui-refresh-surface z-modal-popover">
    <div class="ui-modal-shell import-modal-shell" role="dialog" aria-modal="true" aria-labelledby="import-modal-title"
        @click.away="if(!conflictData) showImportUrlModal=false">
        
        <!-- Header -->
        <div class="ui-modal-header import-modal-header">
            <h3 id="import-modal-title" class="ui-modal-title flex items-center gap-2">
                <span x-show="!conflictData" class="inline-flex items-center gap-2">
                    <span aria-hidden="true">{{ icon('link-import', 'ui-icon--md') }}</span>
                    <span>从 URL 导入角色卡</span>
                </span>
                <span x-show="conflictData" class="inline-flex items-center gap-2 color-text-warning">
                    <span aria-hidden="true">{{ icon('alert-triangle', 'ui-icon--sm') }}</span>
                    <span>文件名冲突</span>
                </span>
            </h3>
            <button type="button" class="ui-close-button" @click="showImportUrlModal=false" title="关闭导入窗口" aria-label="关闭导入窗口">
                {{ icon('close', 'ui-icon--md') }}
            </button>
        </div>
        
        <div class="import-modal-body">
            <!-- 正常导入表单 -->
            <div x-show="!conflictData" class="import-modal-form">
                <div>
                    <label class="form-label" for="import-url-input">图片链接</label>
                    <div class="relative">
                        <input id="import-url-input" type="url" x-model="importUrlInput" class="form-input import-url-input" placeholder="https://example.com/character.png"
                            @keydown.enter="importFromUrl()">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 color-text-muted" aria-hidden="true">
                            {{ detail_icon('link-source', 'ui-icon--sm') }}
                        </div>
                    </div>
                    <div class="text-xs mt-2 color-text-muted">支持 PNG 直链。</div>
                </div>
                
                <div>
                    <label class="form-label inline-flex items-center gap-1">
                        <span aria-hidden="true">{{ detail_icon('locate', 'ui-icon--sm') }}</span>
                        <span>保存位置</span>
                    </label>
                    <div id="import-category-select" class="icon-select" :class="{ 'is-open': categoryMenuOpen }" @click.outside="categoryMenuOpen = false">
                        <button type="button" class="icon-select-trigger" :aria-expanded="categoryMenuOpen.toString()"
                            aria-haspopup="listbox" aria-controls="import-category-options"
                            @click="categoryMenuOpen = !categoryMenuOpen"
                            @keydown.arrow-down.prevent="categoryMenuOpen = true"
                            @keydown.escape.stop="categoryMenuOpen = false">
                            <span class="icon-select-trigger-icon" aria-hidden="true">
                                <span x-show="importTargetCategory === ''" x-cloak>{{ sidebar_icon('folder-open', 'ui-icon--sm') }}</span>
                                <span x-show="importTargetCategory === '根目录'" x-cloak>{{ icon('folder-root', 'ui-icon--sm') }}</span>
                                <span x-show="importTargetCategory !== '' && importTargetCategory !== '根目录'" x-cloak>{{ sidebar_icon('folder-solid', 'ui-icon--sm') }}</span>
                            </span>
                            <span class="icon-select-label" x-text="importTargetCategory || '(当前浏览目录)'"></span>
                            <span class="icon-select-chevron" aria-hidden="true">{{ icon('chevron-down', 'ui-icon--xs') }}</span>
                        </button>
                        <div id="import-category-options" x-show="categoryMenuOpen" x-cloak class="icon-select-menu"
                            role="listbox" aria-label="保存位置">
                            <button type="button" role="option" class="icon-select-option"
                                :aria-selected="(importTargetCategory === '').toString()"
                                @click="importTargetCategory = ''; categoryMenuOpen = false">
                                <span class="icon-select-option-icon" aria-hidden="true">{{ sidebar_icon('folder-open', 'ui-icon--sm') }}</span>
                                <span class="icon-select-option-label">(当前浏览目录)</span>
                            </button>
                            <button type="button" role="option" class="icon-select-option"
                                :aria-selected="(importTargetCategory === '根目录').toString()"
                                @click="importTargetCategory = '根目录'; categoryMenuOpen = false">
                                <span class="icon-select-option-icon" aria-hidden="true">{{ icon('folder-root', 'ui-icon--sm') }}</span>
                                <span class="icon-select-option-label">根目录</span>
                            </button>
                            <template x-for="folder in allFoldersList" :key="folder.path">
                                <button type="button" role="option" class="icon-select-option"
                                    :aria-selected="(importTargetCategory === folder.path).toString()"
                                    @click="importTargetCategory = folder.path; categoryMenuOpen = false">
                                    <span class="icon-select-option-icon" aria-hidden="true">{{ sidebar_icon('folder-solid', 'ui-icon--sm') }}</span>
                                    <span class="icon-select-option-label" x-text="folder.path"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="import-modal-actions">
                    <button @click="showImportUrlModal=false" class="btn-secondary">取消</button>
                    <button @click="importFromUrl()" :disabled="isLoading" class="btn-primary"
                        >
                        <span x-show="!isLoading" class="inline-flex items-center gap-2">
                            <span aria-hidden="true">{{ icon('file-import', 'ui-icon--sm') }}</span>
                            <span>立即导入</span>
                        </span>
                        <span x-show="isLoading" class="flex items-center gap-2">
                            <span aria-hidden="true">{{ icon('loader-circle', 'ui-icon--sm ui-icon--spin') }}</span>
                            下载中...
                        </span>
                    </button>
                </div>
            </div>

            <!-- 冲突解决界面 -->
            <div x-show="conflictData" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="import-modal-form">
                
                <p class="import-modal-conflict-note">
                    目标文件夹中已存在同名角色卡。<br>请选择如何处理新导入的文件。
                </p>
                
                <!-- Comparison Card -->
                <div class="import-modal-conflict-grid">
                    
                    <!-- Existing -->
                    <div class="import-modal-conflict-side">
                        <div class="import-modal-conflict-label">原有</div>
                        
                        <div class="import-modal-conflict-image">
                            <img :src="conflictData ? conflictData.existing_card.image_url : ''" alt="原有角色卡预览">
                        </div>
                        <div class="import-modal-conflict-meta">
                            <div class="import-modal-conflict-name" x-text="conflictData?.existing_card.char_name"></div>
                            <div class="import-modal-conflict-stats">
                                <span class="import-modal-conflict-stat" x-text="(conflictData?.existing_card.token_count || 0) + ' Tk'"></span>
                                <span class="import-modal-conflict-stat" x-text="Math.round((conflictData?.existing_card.file_size || 0) / 1024) + ' KB'"></span>
                            </div>
                        </div>
                    </div>

                    <!-- New -->
                    <div class="import-modal-conflict-side is-new">
                        <div class="import-modal-conflict-label">NEW / 导入</div>
                        
                        <div class="import-modal-conflict-image">
                            <img :src="conflictData ? conflictData.new_card.image_url : ''" alt="新导入角色卡预览">
                        </div>
                        <div class="import-modal-conflict-meta">
                            <div class="import-modal-conflict-name" x-text="conflictData?.new_card.char_name"></div>
                            <div class="import-modal-conflict-stats">
                                <span class="import-modal-conflict-stat" x-text="(conflictData?.new_card.token_count || 0) + ' Tk'"></span>
                                <span class="import-modal-conflict-stat" x-text="Math.round((conflictData?.new_card.file_size || 0) / 1024) + ' KB'"></span>
                            </div>
                        </div>
                    </div>

                </div>
                
                <!-- Actions -->
                <div class="import-modal-conflict-actions">
                    <button @click="resolveConflict('cancel')" class="btn-ghost">
                        放弃 (Esc)
                    </button>
                    <button @click="resolveConflict('overwrite')" class="btn-danger">
                        <span class="inline-flex items-center gap-1" style="font-size: 0.9rem;">
                            <span aria-hidden="true">{{ detail_icon('overwrite', 'ui-icon--sm') }}</span>
                            <span>覆盖</span>
                        </span>
                    </button>
                    <button @click="resolveConflict('rename')" class="btn-primary">
                        <span class="inline-flex items-center gap-1" style="font-size: 0.9rem;">
                            <span aria-hidden="true">{{ icon('pencil-edit', 'ui-icon--sm') }}</span>
                            <span>追加 (Enter)</span>
                        </span>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
