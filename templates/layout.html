<!-- templates/layout.html -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- 主程序版本：前端 `contributionRegistry.js` 的 `when.hostVersion` 求值读这里 -->
    <meta name="app-version" content="{{ app_version }}" />
    <meta name="plugin-api-version" content="{{ plugin_api_version }}" />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/brand/stm-mark.png') }}"
    />
    <title>ST Manager Pro V{{ app_version|default('', true) }}</title>

    <!-- 核心样式 -->
    <link rel="stylesheet" href="/static/lib/cards-css/holo-cards.css" />
    <!-- 抽卡稀有度层：作用域限定在 .gacha-reveal，必须排在 holo-cards.css 之后 -->
    <link rel="stylesheet" href="/static/lib/pokemon-cards-css/css/cards.css" />
    <link rel="stylesheet" href="/static/lib/pokemon-cards-css/css/cards/radiant-holo.css" />
    <link rel="stylesheet" href="/static/lib/pokemon-cards-css/css/cards/secret-rare.css" />
    <link rel="stylesheet" href="/static/lib/pokemon-cards-css/css/cards/rainbow-holo.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <link rel="stylesheet" href="/static/css/color-system.css" />
    <link rel="stylesheet" href="/static/css/worldbook-update.css" />

    <!-- pack-opener 的 dist 只裸导入 "pixi.js"；用 import map 指到自包含 ESM，免打包器。
         必须在任何 module script 之前声明。 -->
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "/static/lib/pack-opener/pixi.min.mjs"
        }
      }
    </script>
    <script type="module" src="/static/js/app.js"></script>
    <!-- 第三方库 (Phase 1 归档位置) -->
    <script src="/static/lib/alpine-collapse.js"></script>
    <script src="/static/lib/alpine.js" defer></script>
    <script src="/static/lib/showdown.min.js"></script>
    <script src="/static/lib/marked.min.js"></script>
    <script src="/static/lib/purify.min.js"></script>
    <script src="/static/lib/diff.min.js"></script>
  </head>

  <!-- 全局状态绑定 -->
  <body
    x-data="layout"
    x-effect="document.documentElement.classList.toggle('light-mode', !isDarkMode)"
  >
    <!-- 1. 全局 Loading 遮罩 -->
    {% include "components/loading.html" %}

    <!-- 1.5 批量操作进度 -->
    {% include "components/batch_progress.html" %}

    <!-- 2. 主内容插槽 -->
    {% block content %}{% endblock %}

    <!-- 3. 全局 Toast 通知
         图标位按 `resolveToastIcon()` 的 kind 分三条渲染路径（与 uiPrimitives.js 同源契约）：
         ① 独立动效 SVG 走 <img>；② 插件自带资源走 CSS mask（填充式图形，塞进 <use> 会是空图形）；
         ③ 宿主图标名走 sprite <use>（描边式图形，用 mask 会变实心块）。 -->
    <div
      class="toast-notification"
      :class="{'show': showToastState}"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <span x-show="toastIcon" aria-hidden="true">
        <template x-if="toastIconKind === 'image'">
          <img
            class="ui-icon ui-icon--sm ui-loading-icon"
            :src="toastIconHref"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </template>
        <template x-if="toastIconKind === 'asset'">
          <span
            class="ui-icon ui-icon--sm ui-icon--asset"
            :style="{ '--ui-icon-mask': toastIconMask }"
          ></span>
        </template>
        <template x-if="toastIconKind === 'host'">
          <svg
            class="ui-icon ui-icon--sm"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <use :href="toastIconHref"></use>
          </svg>
        </template>
      </span>
      <span x-text="toastMessage"></span>
    </div>
  </body>
</html>
