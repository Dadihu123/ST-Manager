name: Build Android APK

# 独立工作流，**不加入** build-desktop.yml 的 publish-release.needs
# （否则移动端失败会拦住桌面端 Release，与「保留桌面发布」冲突）。
#
# 两种产物：
#   - debug   ：每次 push/PR 都出，使用调试密钥签名，用于验证构建与真机自测。
#   - release ：仅在 tag（v*）上出，需要签名密钥；产出可直接分发的 APK。
# 两者都上传为 artifact；tag 上额外的 release 包会挂到 GitHub Release。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'core/**'
      - 'static/**'
      - 'templates/**'
      - 'tools/build_android_wheelhouse.py'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'core/**'
      - 'static/**'
      - 'templates/**'
      - 'tools/build_android_wheelhouse.py'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Chaquopy 编译字节码要求构建机有**同版本** Python（app 里写的是 3.13）。
      # 必须放在 Gradle 之前，否则 Chaquopy 会报「找不到匹配的 Python」。
      - name: Set up Python 3.13 (must match chaquopy version in app/build.gradle.kts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Chaquopy 在 Linux 上按 python3.13 -> python3 -> python 的顺序查找。
      # setup-python 会提供 python3.13，这里显式兜底并打印，便于排查。
      - name: Verify build Python matches app Python
        run: |
          python --version
          python3 --version || true
          if ! command -v python3.13 >/dev/null 2>&1; then
            echo "python3.13 不在 PATH，创建别名指向当前 python"
            ln -sf "$(command -v python)" "$(dirname "$(command -v python)")/python3.13"
          fi
          python3.13 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Chaquopy 依赖走 android/wheelhouse 离线安装（app/build.gradle.kts 里
      # 传了 --no-index）。wheelhouse 不入库（2.4 MB 二进制，可完全重建），
      # 因此这里先生成。脚本自己会做「--no-index 能否解析全部依赖」的校验，
      # 失败即非零退出，不会带着残缺的 wheelhouse 继续构建。
      - name: Generate offline wheelhouse
        run: python tools/build_android_wheelhouse.py

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      # 先验证 Kotlin 编译和下载写入的失败回收，再打包。
      - name: Kotlin compile and unit tests
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------------------------------
      # 以下只在 tag 上跑：签出可分发的 release APK。
      #
      # 四个 Secret 缺一不可，缺失时**直接失败**而不是悄悄出 unsigned 包
      # —— 一个装不上的 APK 混进 Release 比构建失败更糟。
      # ---------------------------------------------------------------------
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，无法签出可安装包" >&2
            exit 1
          fi
          # 解码到 runner 临时目录；权限收紧，避免被其他步骤读到。
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          ls -l "$keystore"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少签名变量 $v" >&2
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 用 apksigner 校验产物真的被签过，并把指纹打进日志。
      # 没有这一步，签名配置写错时会一路绿灯到用户安装失败。
      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::未产出 $apk（可能仍是 unsigned 包名）" >&2
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n1)"
          "$signer" verify --verbose --print-certs "$apk"

      - name: Show APK sizes
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ST-Manager-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 版本号放在产物文件名里，便于用户区分：
      #   ST-Manager-Pro-1.2.0-android-arm64.apk
      # 命名与桌面端对齐（ST-Manager-Pro-<ver>-<platform>-<arch>.<ext>）。
      - name: Normalize release APK name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          src="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p release
          dst="release/ST-Manager-Pro-${version}-android-arm64.apk"
          cp "$src" "$dst"
          ls -l release

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          # artifact 名不带 ST-Manager-Pro- 前缀：桌面 publish-release 会按
          # 该前缀下载 artifact，同名会互相污染。Release 资产名在下一步
          # 才规范成 ST-Manager-Pro-<ver>-android-arm64.apk。
          name: ST-Manager-Android-release
          path: release/*.apk
          if-no-files-found: error

  # 把 Android 的 release 包挂到同一个 GitHub Release 上。
  #
  # 与 build-desktop.yml 的 publish-release 是**两个独立 job**：
  # 桌面端失败不应该阻断 Android 发布，反之亦然。
  # 两边都用 `gh release upload --clobber`，谁先跑到谁先传，互不覆盖别人。
  publish-release:
    name: Publish Android release asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ST-Manager-Android-release
          path: release

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          ls -l release
          # 必须确认真的有 APK：空目录会让 gh 报一个难懂的错误。
          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "::error::release 目录里没有 APK" >&2
            exit 1
          fi

          # Release 可能已由桌面端 job 建过（带正文）：只在缺失时创建，
          # 绝不覆盖已有正文——与 build-desktop.yml 的约定保持一致。
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi

          gh release upload "$tag" release/*.apk --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
