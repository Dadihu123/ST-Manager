name: Build Desktop Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows package
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name "ST Manager Pro V102"
          --icon "static/images/brand/stm-mark.png"
          --add-data "templates;templates"
          --add-data "static;static"
          app.py

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ST-Manager-Pro-V102-windows
          path: dist/ST Manager Pro V102.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --windowed \
            --name "ST Manager Pro V102" \
            --target-arch "${{ matrix.arch }}" \
            --icon "软件图标.ico" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            app.py

      - name: Archive macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ST Manager Pro V102.app" \
            "ST-Manager-Pro-V102-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ST-Manager-Pro-V102-macos-${{ matrix.arch }}
          path: ST-Manager-Pro-V102-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
