distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Mirror note: the official source measured 0.13 MB/s from CN (130 MB / ~17 min),
# which exceeds the default networkTimeout below and fails the wrapper download.
# mirrors.cloud.tencent.com measured 6.64 MB/s (~20 s) and serves a byte-identical
# file (136920070 bytes, verified). To switch back to the official source, use:
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
# 120s: also covers slow first-time dependency resolution from Maven / Chaquopy.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
